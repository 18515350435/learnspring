<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0519c">
<title>星光小马妆造馆 · 家长端</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<header class="app-header admin">
  <div class="wrap head-wrap">
    <div class="brand">
      <span class="brand-mark admin"></span>
      <span class="brand-text">
        <b>家长管理端</b>
        <i>审核任务 · 管理解锁 · 自定义奖励</i>
      </span>
    </div>
    <nav class="nav">
      <button class="nav-btn" data-atab="review" type="button">待审核<em id="adminBadge" class="dot">0</em></button>
      <button class="nav-btn" data-atab="tasks" type="button">任务总览</button>
      <button class="nav-btn" data-atab="manage" type="button">解锁管理</button>
      <button class="nav-btn" data-atab="data" type="button">数据与设置</button>
      <button class="nav-btn cheat-btn" id="cheatBtn" data-cheat type="button">🔒 破解开关</button>
      <a class="nav-btn alt" href="index.html">返回玩家端</a>
    </nav>
    <div class="who"><i>审核身份</i><b>家长</b></div>
  </div>
</header>

<div class="wrap lock" id="lockScreen">
  <div class="lock-card">
    <div id="lockBox"></div>
  </div>
</div>

<main class="wrap main" id="adminBody" style="display:none">
  <div id="adminPanel"></div>
</main>

<footer class="app-footer">
  <p>存档保存在本机浏览器（localStorage），与玩家端实时互通。本页为个人学习用途的同人项目，小马宝莉形象版权归 Hasbro 所有。</p>
</footer>

<script src="js/data.js"></script>
<script src="js/pony.js"></script>
<script src="js/cloud.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
