<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0519c">
<title>星光小马妆造馆</title>
<style>
/* ===== 星光小马妆造馆 · 样式 ===== */
:root {
  --c-page: #fdf6ff;
  --c-card: #ffffff;
  --c-text: #45355c;
  --c-muted: #9186a3;
  --c-line: #f1e7fa;
  --c-primary: #e0519c;
  --c-primary-dk: #b93b7d;
  --c-purple: #9a7ae0;
  --c-blue: #56a9e6;
  --c-green: #4fae84;
  --c-amber: #f0a91b;
  --c-danger: #d9534f;
  --c-pink-soft: #ffeaf5;
  --c-mint-soft: #e6f8f2;
  --c-sky-soft: #e8f4ff;
  --radius: 16px;
  --radius-sm: 10px;
  --wrap: 1180px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.7;
  color: var(--c-text);
  background: var(--c-page);
  background-image:
    radial-gradient(circle at 12% 8%, #ffe3f2 0, rgba(255, 227, 242, 0) 42%),
    radial-gradient(circle at 88% 0%, #e6e0ff 0, rgba(230, 224, 255, 0) 40%);
  background-attachment: fixed;
  min-height: 100vh;
}

h1, h2, h3, h4, h5 { margin: 0 0 .5em; line-height: 1.35; font-weight: 600; }
p { margin: 0 0 .8em; }
.wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }
.muted { color: var(--c-muted); }
.sm { font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

/* ===== 页头 ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, .88);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--c-line);
}
.head-wrap {
  display: flex;
  align-items: center;
  gap: 18px;
  padding-top: 10px;
  padding-bottom: 10px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 50%;
  background: conic-gradient(from 210deg, #ff8fc0, #ffd066, #7fe0a8, #7fc8f5, #b98ce0, #ff8fc0);
  box-shadow: 0 2px 8px rgba(217, 79, 150, .25);
  flex: none;
}
.brand-mark.admin {
  background: conic-gradient(from 30deg, #6f63c9, #56a9e6, #4fae84, #6f63c9);
  box-shadow: 0 2px 8px rgba(111, 99, 201, .3);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text b { font-size: 17px; font-weight: 600; }
.brand-text i { font-style: normal; font-size: 12.5px; color: var(--c-muted); }

.nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.nav-btn {
  position: relative;
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--c-text);
  font: inherit;
  font-size: 14px;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
  transition: background .15s, color .15s, border-color .15s;
}
.nav-btn:hover { background: #f8eff7; }
.nav-btn.on { background: #ffe9f4; color: var(--c-primary-dk); font-weight: 600; }
.nav-btn.alt { border-color: var(--c-line); color: var(--c-purple); }

/* 破解开关：默认琥珀色，开启后变绿 */
.nav-btn.cheat-btn {
  border-color: #f0c14b;
  background: linear-gradient(135deg, #fff7e2, #ffe4b0);
  color: #8a5a00;
  font-weight: 600;
}
.nav-btn.cheat-btn:hover { background: linear-gradient(135deg, #ffefbe, #ffd489); }
.nav-btn.cheat-btn.on {
  border-color: #6ec97f;
  background: linear-gradient(135deg, #eaf9ec, #c6efd2);
  color: #1c7a33;
}
.dot {
  display: inline-block;
  min-width: 18px;
  padding: 0 5px;
  margin-left: 5px;
  border-radius: 999px;
  background: var(--c-primary);
  color: #fff;
  font-size: 11px;
  font-style: normal;
  line-height: 18px;
  text-align: center;
  vertical-align: 1px;
}
.who { font-size: 13px; color: var(--c-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.who b { color: var(--c-primary-dk); font-size: 15px; }
.who-name { display: inline-flex; gap: 4px; align-items: baseline; }
.wallet-chip {
  background: #fff8e6; border: 1px solid #ffe2ab; color: #8a5a00;
  border-radius: 999px; padding: 2px 11px; font-size: 12.5px; white-space: nowrap;
}
.wallet-chip b { color: #c8860a; font-size: 14px; }
.wallet-chip.lv { background: #f3ecff; border-color: #ded0ff; color: #5b3fa8; }
.wallet-chip.lv b { color: #5b3fa8; }

.main { padding: 22px 20px 40px; }
.app-footer {
  border-top: 1px solid var(--c-line);
  padding: 16px 20px 28px;
  text-align: center;
  color: var(--c-muted);
  font-size: 12.5px;
}
.app-footer p { margin: 0; }

/* ===== 通用控件 ===== */
.btn {
  appearance: none;
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 9px 20px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  background: #f2eaf5;
  color: var(--c-text);
  transition: transform .08s, opacity .15s, background .15s;
  white-space: nowrap;
}
.btn:hover { opacity: .92; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--c-primary); color: #fff; }
.btn.ghost { background: #fff; border-color: var(--c-line); }
.btn.danger { background: var(--c-danger); color: #fff; }
.btn.sm { padding: 7px 15px; font-size: 13.5px; }
.btn.xs { padding: 4px 11px; font-size: 12.5px; }

.ipt {
  appearance: none;
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font: inherit;
  font-size: 14px;
  background: #fff;
  color: var(--c-text);
  width: 100%;
}
.ipt:focus { outline: none; border-color: var(--c-primary); }
.ipt.big { font-size: 16px; padding: 11px 14px; text-align: center; letter-spacing: 4px; }

.ta {
  width: 100%;
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font: inherit;
  font-size: 14px;
  resize: vertical;
  background: #fff;
  color: var(--c-text);
}
.ta:focus { outline: none; border-color: var(--c-primary); }

.tag {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  background: #efe6fb;
  color: var(--c-purple);
  font-size: 11.5px;
}
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  background: #f2eef5;
  color: var(--c-muted);
}
.badge.pending { background: #fff2d9; color: #a06a10; }
.badge.approved { background: #e2f6ec; color: #2f7a55; }
.badge.rejected { background: #fde8e7; color: #a63b37; }
.badge.todo { background: #f2eef5; color: var(--c-muted); }

.rw {
  display: inline-block;
  padding: 3px 10px;
  margin: 2px 4px 2px 0;
  border-radius: 999px;
  background: #ffeaf3;
  color: var(--c-primary-dk);
  font-size: 12px;
}

.empty {
  padding: 40px 16px;
  text-align: center;
  color: var(--c-muted);
  background: #fff;
  border: 1px dashed var(--c-line);
  border-radius: var(--radius);
}
.sec-title {
  font-size: 15px;
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-title em {
  font-style: normal;
  font-size: 12px;
  color: var(--c-muted);
  background: #f7f0f8;
  padding: 1px 8px;
  border-radius: 999px;
}

.warnbar {
  background: #fff4d6;
  color: #8a5a00;
  padding: 10px 20px;
  font-size: 13px;
  text-align: center;
  border-bottom: 1px solid #f0dca8;
}
.warnbar code { background: rgba(0, 0, 0, .06); padding: 1px 5px; border-radius: 4px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  background: rgba(59, 47, 74, .94);
  color: #fff;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 99;
  transition: opacity .4s, transform .4s;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
}
.toast.out { opacity: 0; transform: translate(-50%, 10px); }

/* ===== 弹层 ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(59, 47, 74, .38);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 60;
}
.modal-card {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 460px;
  max-height: 86vh;
  overflow: auto;
  box-shadow: 0 16px 44px rgba(59, 47, 74, .24);
}
.modal-card h3 { font-size: 18px; }
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 18px;
  flex-wrap: wrap;
}
.lock-task {
  background: #fdf3f8;
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin: 6px 0 12px;
}
.lock-task h4 { margin: 6px 0; font-size: 16px; }

.lock-q {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #f1ecf4;
  color: #b7abc2;
  font-size: 20px;
  font-weight: 600;
}

/* ===== 妆造台 ===== */
.studio {
  display: grid;
  grid-template-columns: minmax(300px, 380px) 1fr;
  gap: 22px;
  align-items: start;
}
.stage-card {
  position: relative;
  border-radius: 22px;
  padding: 18px 18px 14px;
  text-align: center;
  overflow: hidden;
  border: 1px solid var(--c-line);
  box-shadow: 0 8px 24px rgba(59, 47, 74, .08);
}
.stage-card svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.stage-name {
  font-size: 18px;
  font-weight: 600;
  margin-top: 6px;
  color: var(--c-text);
}
.stage-name span {
  display: inline-block;
  margin-left: 8px;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--c-muted);
  background: rgba(255, 255, 255, .75);
  padding: 1px 8px;
  border-radius: 999px;
}
.stage-desc { font-size: 13px; color: var(--c-muted); margin: 2px 0 0; }
.stage-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.looks {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 13px;
}
.look-chip {
  display: inline-flex;
  align-items: center;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: 999px;
  overflow: hidden;
}
.look-load, .look-del {
  appearance: none;
  border: none;
  background: transparent;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  padding: 5px 12px;
  color: var(--c-text);
}
.look-del { padding: 5px 9px; color: var(--c-danger); border-left: 1px solid var(--c-line); }

.wardrobe {
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  padding: 4px 18px 22px;
}
.pony-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
}
.pony-list.big { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.pony-chip {
  appearance: none;
  border: 1px solid var(--c-line);
  background: #fffdfd;
  border-radius: 14px;
  padding: 8px 6px 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font: inherit;
  transition: border-color .15s, box-shadow .15s, transform .1s;
}
.pony-chip:hover { border-color: var(--c-primary); transform: translateY(-2px); }
.pony-chip.on { border-color: var(--c-primary); box-shadow: 0 0 0 2px #ffd9ec; }
.pony-chip.locked { opacity: .62; }
.pony-chip-art { display: flex; align-items: center; justify-content: center; min-height: 90px; }
.pony-chip-art svg { display: block; max-width: 100%; height: auto; }
.pony-chip-name { font-size: 13.5px; font-weight: 600; }
.pony-chip-race { font-size: 11px; color: var(--c-muted); }

.cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.cat {
  appearance: none;
  border: 1px solid var(--c-line);
  background: #fff;
  border-radius: 999px;
  padding: 5px 13px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  color: var(--c-text);
}
.cat.on { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.item-tip { font-size: 12.5px; color: var(--c-muted); min-height: 22px; }

.item-grid { display: flex; flex-direction: column; gap: 14px; }
.item-group h4 { font-size: 13px; color: var(--c-muted); margin: 0 0 6px; font-weight: 500; }
.item-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.item-cell {
  appearance: none;
  border: 1px solid var(--c-line);
  background: #fff;
  border-radius: 14px;
  padding: 8px 6px 7px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font: inherit;
  transition: border-color .15s, transform .1s;
}
.item-cell:hover { transform: translateY(-2px); border-color: var(--c-primary); }
.item-cell.on { border-color: var(--c-primary); background: #fff5f9; }
.item-cell.locked { opacity: .66; }
.cell-art { display: flex; align-items: center; justify-content: center; min-height: 118px; }
.cell-art svg { display: block; max-width: 100%; height: auto; }
.cell-name { font-size: 12.5px; }
.cell-lock { font-size: 11px; color: var(--c-muted); }
.bg-cell { min-height: 150px; justify-content: flex-end; }
.cell-bg {
  display: block;
  width: 100%;
  height: 92px;
  border-radius: 10px;
  margin-bottom: 6px;
}

/* 背景配方 */
.bg-sky { background: linear-gradient(180deg, #a9e3ff 0%, #dcf3ff 55%, #ffffff 100%); }
.bg-rainbow { background: linear-gradient(135deg, #ffc9e6 0%, #fff4c2 34%, #c6f0df 66%, #cbe6ff 100%); }
.bg-night { background: linear-gradient(180deg, #2f2670 0%, #5b40a4 55%, #8e6fd4 100%); }

/* ===== 任务中心 ===== */
.tasks { background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius); padding: 18px 20px 24px; }
.task-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.task-head .sec-title { margin-top: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  appearance: none;
  border: 1px solid var(--c-line);
  background: #fff;
  border-radius: 999px;
  padding: 5px 13px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  color: var(--c-text);
}
.chip.on { background: var(--c-purple); border-color: var(--c-purple); color: #fff; }

.task-list {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.task-card {
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  padding: 14px 16px;
  background: #fffdfd;
  transition: box-shadow .2s, border-color .2s;
}
.task-card.pending { border-color: #f3d9a4; background: #fffaf0; }
.task-card.approved { border-color: #bfe6d2; background: #f8fdfa; }
.task-card.rejected { border-color: #f3c2c0; background: #fff8f7; }
.task-card.focus { box-shadow: 0 0 0 3px #ffd9ec; }
.task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.task-title { font-size: 16px; margin: 8px 0 4px; }
.task-desc { font-size: 13px; color: var(--c-muted); margin: 0 0 8px; }
.task-note, .task-reason {
  font-size: 12.5px;
  margin: 0 0 6px;
  padding: 7px 10px;
  border-radius: 8px;
  background: #f6f1f8;
  color: #5d5070;
}
.task-reason { background: #fdeceb; color: #a63b37; }
.task-rewards { margin: 6px 0 10px; }
.task-foot { display: flex; justify-content: flex-end; }
.ok { color: var(--c-green); font-size: 13px; }

/* ===== 图鉴 ===== */
.gallery { background: #fff; border: 1px solid var(--c-line); border-radius: var(--radius); padding: 18px 20px 26px; }
.progress-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.pg { display: flex; justify-content: space-between; font-size: 13px; }
.pg b { color: var(--c-primary-dk); }
.bar { height: 8px; border-radius: 999px; background: #f2ecf5; overflow: hidden; margin-bottom: 8px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff9bc6, #b98ce0); }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.mini {
  border: 1px solid var(--c-line);
  border-radius: 12px;
  padding: 6px;
  text-align: center;
  font-size: 12px;
  background: #fffdfd;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.mini.locked { opacity: .55; }
.mini-art { display: flex; justify-content: center; }
.mini-art svg { display: block; max-width: 100%; height: auto; }
.mini .cell-bg { height: 60px; }

/* ===== 管理端 ===== */
.lock { padding-top: 60px; padding-bottom: 60px; }
.lock-card {
  max-width: 380px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: 20px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 8px 26px rgba(59, 47, 74, .08);
}
.pin-err { color: var(--c-danger); font-size: 13px; min-height: 22px; margin: 6px 0 10px; }
.adm-head { margin-bottom: 16px; }
.adm-head .sec-title { margin-top: 0; font-size: 18px; }
.adm-head em { background: var(--c-primary); color: #fff; }

.rev-list { display: grid; gap: 14px; }
.rev-card {
  display: grid;
  grid-template-columns: 1fr 200px;
  gap: 16px;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.rev-main h4 { font-size: 16px; margin: 8px 0 4px; }
.rev-desc { font-size: 13px; color: var(--c-muted); margin: 0 0 8px; }
.rev-note {
  font-size: 13px;
  background: #f6f1f8;
  border-radius: 8px;
  padding: 8px 11px;
  margin: 0 0 6px;
}
.rev-time { font-size: 12px; color: var(--c-muted); margin: 0; }
.rev-side { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.rev-rw { margin-bottom: 4px; }

.table { border: 1px solid var(--c-line); border-radius: var(--radius); overflow: hidden; background: #fff; }
.tr {
  display: grid;
  grid-template-columns: 1.4fr 1.2fr 92px 150px;
  gap: 10px;
  padding: 10px 14px;
  align-items: center;
  border-bottom: 1px solid var(--c-line);
  font-size: 13.5px;
}
.tr:last-child { border-bottom: none; }
.tr.head { background: #faf6fb; color: var(--c-muted); font-size: 12.5px; }
.tname i { display: block; font-style: normal; font-size: 11.5px; color: var(--c-muted); }
.trw { font-size: 12.5px; color: var(--c-muted); }
.tops { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.manage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
.mg {
  border: 1px solid var(--c-line);
  border-radius: 14px;
  padding: 10px 8px;
  background: #fffdfd;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.mg.on { border-color: #cfeee0; background: #fbfefc; }
.mg-art { display: flex; align-items: center; justify-content: center; min-height: 92px; width: 100%; }
.mg-art.cell-bg { height: 92px; border-radius: 12px; }
.mg-name { font-size: 12.5px; }

/* ===== 小马家园 ===== */

.room {

  border-radius: 20px;
  overflow: hidden;

/* 昼夜切换 */
.room .day-only, .room .day-sky { opacity: 1; transition: opacity .7s ease; }
.room .night-only, .room .night-sky { opacity: 0; transition: opacity .7s ease; }
.room.night .day-only, .room.night .day-sky { opacity: 0; }
.room.night .night-only, .room.night .night-sky { opacity: 1; }

.room .cloud.c2 { animation-duration: 30s; animation-delay: -6s; }
@keyframes drift { 0% { transform: translateX(-10px); } 50% { transform: translateX(26px); } 100% { transform: translateX(-10px); } }
.room .tw { animation: twinkle 2.4s ease-in-out infinite; }
.room .tw.t2 { animation-delay: .6s; }
.room .tw.t3 { animation-delay: 1.1s; }
.room .tw.t4 { animation-delay: 1.7s; }
@keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.room .bunting { animation: sway 4.5s ease-in-out infinite; transform-origin: 300px 36px; }
@keyframes sway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }

/* 小马 */
.hm-pony {
  position: absolute;
  width: 12%;
  min-width: 62px;
  transform-origin: 50% 100%;
  pointer-events: auto;
  cursor: pointer;
  transition: filter .2s;
}
.hm-pony:hover { filter: brightness(1.06) drop-shadow(0 0 6px rgba(255, 190, 220, .9)); }

.hm-pony.walk .hm-inner { animation: hmHop .46s ease-in-out infinite; }
.hm-pony.jump .hm-inner { animation: hmJump .56s cubic-bezier(.3, .8, .4, 1); }
@keyframes hmIdle {
  0%, 100% { transform: translateY(0) rotate(-1.5deg); }
  50% { transform: translateY(-4px) rotate(1.5deg); }
}
@keyframes hmHop {
  0% { transform: translateY(0) rotate(-5deg) scale(1, 1); }
  45% { transform: translateY(-14px) rotate(5deg) scale(1.03, .97); }
  100% { transform: translateY(0) rotate(-5deg) scale(1, 1); }
}
@keyframes hmJump {
  0% { transform: translateY(0) scale(1, 1); }
  35% { transform: translateY(-30px) scale(1.08, .92); }
  62% { transform: translateY(0) scale(.94, 1.07); }

}

/* 零食与飘浮特效 */

.gscore b, .gtime b { color: var(--c-primary-dk); font-size: 16px; }
.star-field {
  position: relative; height: 360px; border-radius: 18px; overflow: hidden;

}
.game-tip { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--c-muted); font-size: 14px; }
.fall-star {
  position: absolute; top: -34px; font-size: 26px; cursor: pointer;

  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .18));
}
.fall-star.gold { font-size: 33px; }
@keyframes hmFall { to { transform: translateY(420px) rotate(200deg); } }
.star-pop { position: absolute; font-size: 16px; font-weight: 600; color: var(--c-amber); animation: hmPop .7s ease-out forwards; }
@keyframes hmPop { to { transform: translateY(-42px); opacity: 0; } }
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 540px; margin: 0 auto; }
.mem-card {

/* ===== 成就 ===== */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }

.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.photo { background: #fff; border: 1px solid var(--c-line); border-radius: 14px; overflow: hidden; }

.ph-info i { font-style: normal; font-size: 11.5px; color: var(--c-muted); }

.streak-row { display: flex; gap: 6px; margin: 12px 0; }

<script>

/**
 * 小马形象渲染引擎

(function () {
  'use strict';

  var VB = '0 0 260 300';

  /* ---------- 通用图形助手 ---------- */

  function star(cx, cy, r, fill) {
    var d = '', i, rr, a, x, y;
    for (i = 0; i < 10; i++) {
      rr = i % 2 ? r * 0.45 : r;
      a = -Math.PI / 2 + i * Math.PI / 5;
      x = cx + rr * Math.cos(a);
      y = cy + rr * Math.sin(a);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    }
    return '<path d="' + d + 'Z" fill="' + fill + '"/>';
  }

  function flower(cx, cy, r, petal, core) {
    var s = '', i, a, px, py;
    for (i = 0; i < 5; i++) {
      a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      px = cx + r * Math.cos(a);
      py = cy + r * Math.sin(a);
      s += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + (r * 0.72).toFixed(1) + '" fill="' + petal + '"/>';
    }
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.55).toFixed(1) + '" fill="' + core + '"/>';
    return s;
  }

  function heartPath(cx, cy, s, fill, stroke) {
    return '<path d="M ' + cx + ',' + (cy + s * 0.85) +
      ' C ' + (cx - s) + ',' + (cy + s * 0.05) + ' ' + (cx - s * 0.5) + ',' + (cy - s * 0.65) + ' ' + cx + ',' + (cy - s * 0.2) +
      ' C ' + (cx + s * 0.5) + ',' + (cy - s * 0.65) + ' ' + (cx + s) + ',' + (cy + s * 0.05) + ' ' + cx + ',' + (cy + s * 0.85) +
      ' Z" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="2"' : '') + '/>';
  }

  /* 鬃毛/刘海支持彩条：取到的值是数组则按索引轮换 */
  function tone(c, i) {

  function layers(c, race, outfit) {

    if (outfit.wing && DECOR.wing[outfit.wing]) push(DECOR.wing[outfit.wing]());

    if (race === '独角兽') push(horn());
    push(ears(c));
    push(bangs(c));

    if (outfit.hair && DECOR.hair[outfit.hair]) push(DECOR.hair[outfit.hair]());
    if (outfit.forehead && DECOR.forehead[outfit.forehead]) push(DECOR.forehead[outfit.forehead]());
    if (outfit.headwear && DECOR.headwear[outfit.headwear]) push(DECOR.headwear[outfit.headwear]());
    if (outfit.glasses && DECOR.glasses[outfit.glasses]) push(DECOR.glasses[outfit.glasses]());
    if (outfit.neck && DECOR.neck[outfit.neck]) push(DECOR.neck[outfit.neck]());
    return out.join('');
  }

  /**

      '<g>' + layers(p.colors, p.race, outfit) + '</g></svg>';
  }

  window.Avatar = { render: render, star: star, flower: flower, heartPath: heartPath };

<script>
/* ===== js/store.js ===== */
/**
 * 共享存储层 + 任务状态机
 * 玩家端（index.html）和家长端（admin.html）共用同一个 localStorage key，
 * 因此两个页面之间天然互通，并通过 storage 事件实时同步。
 */
(function () {
  'use strict';

  var KEY = 'pony_studio_v1';
  var st = null;
  var storageOK = true;
  var fallback = null;
  var listeners = [];

  try {
    localStorage.setItem('__probe__', '1');
    localStorage.removeItem('__probe__');
  } catch (e) {
    storageOK = false;
  }

  function readRaw() {
    if (!storageOK) return fallback;
    try { return localStorage.getItem(KEY); } catch (e) { return fallback; }
  }

  function writeRaw(v) {
    fallback = v;
    if (storageOK) {
      try { localStorage.setItem(KEY, v); } catch (e) { /* 配额或隐私模式，退回内存 */ }
    }
  }

  function initials(kind) {
    if (kind === 'pony') {
      return DATA.PONIES.filter(function (p) { return p.initial; }).map(function (p) { return p.id; });
    }
    return DATA.ITEMS.filter(function (i) { return i.initial; }).map(function (i) { return i.id; });
  }

  function seed() {
    return {
      v: 1,
      player: '小朋友',
      pin: '1234',
      activePony: 'twilight',
      outfit: { bg: 'bg-sky', wing: null, hair: null, forehead: null, headwear: null, glasses: null, eyes: null, cheek: null, neck: null },
      unlocks: { items: initials('item'), ponies: initials('pony') },
      tasks: {},
      customTasks: [],
      looks: [],
      log: [],
      home: { hearts: {}, day: true, pets: 0, sound: true },
      cheat: false,
      cheatBackup: null,

      /* ---- 家园养成 ---- */
      stars: 30,
      starsEarned: 0,
      xp: 0,
      level: 1,
      bag: { 'w-cloud': 1, 'g-marble': 1 },
      needs: {},
      traits: {},
      checkin: { last: '', streak: 0 },
      achievements: {},
      room: { wall: 'w-cloud', floor: 'g-marble', items: [] },
      album: [],
      weather: 'sunny',
      weatherDay: '',
      gameBest: { star: 0, memory: 0 },
      needAt: Date.now(),
      potty: { uses: 0, washes: 0 }
    };
  }

  function todayKey() {
    var d = new Date();
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function load() {
    var raw = readRaw();
    if (!raw) { st = seed(); save(); return; }
    try {
      st = JSON.parse(raw);
    } catch (e) {
      st = seed();
    }
    /* 结构补全，兼容旧版本 */
    var base = seed();
    Object.keys(base).forEach(function (k) {
      if (st[k] === undefined) st[k] = base[k];
    });
    if (!st.unlocks) st.unlocks = base.unlocks;
    if (!st.unlocks.items) st.unlocks.items = base.unlocks.items;
    if (!st.unlocks.ponies) st.unlocks.ponies = base.unlocks.ponies;
    Object.keys(base.outfit).forEach(function (k) {
      if (!(k in st.outfit)) st.outfit[k] = base.outfit[k];
    });
    if (!Array.isArray(st.customTasks)) st.customTasks = [];
    if (!Array.isArray(st.looks)) st.looks = [];
    if (!Array.isArray(st.log)) st.log = [];
    if (!st.home || typeof st.home !== 'object') st.home = base.home;
    if (typeof st.stars !== 'number') st.stars = base.stars;
    if (typeof st.starsEarned !== 'number') st.starsEarned = 0;
    if (typeof st.xp !== 'number') st.xp = 0;
    if (!st.level || st.level < 1) st.level = 1;
    if (!st.bag || typeof st.bag !== 'object') st.bag = base.bag;
    if (!st.needs || typeof st.needs !== 'object') st.needs = {};
    if (!st.traits || typeof st.traits !== 'object') st.traits = {};
    if (!st.checkin || typeof st.checkin !== 'object') st.checkin = base.checkin;
    if (!st.achievements || typeof st.achievements !== 'object') st.achievements = {};
    if (!st.room || typeof st.room !== 'object') st.room = base.room;
    if (!Array.isArray(st.room.items)) st.room.items = [];
    if (!Array.isArray(st.album)) st.album = [];
    if (!st.gameBest || typeof st.gameBest !== 'object') st.gameBest = base.gameBest;
    if (typeof st.needAt !== 'number') st.needAt = Date.now();
    if (!st.potty || typeof st.potty !== 'object') st.potty = base.potty;
    if (typeof st.potty.uses !== 'number') st.potty.uses = 0;
    if (typeof st.potty.washes !== 'number') st.potty.washes = 0;
    /* 每天换一次天气 */
    var tk = todayKey();
    if (st.weatherDay !== tk) {
      var ws = DATA.WEATHERS;
      st.weather = ws[Math.floor(Math.random() * ws.length)].id;
      st.weatherDay = tk;
    }
    if (!st.home.hearts || typeof st.home.hearts !== 'object') st.home.hearts = {};
    if (typeof st.home.day !== 'boolean') st.home.day = true;
    if (typeof st.home.pets !== 'number') st.home.pets = 0;
    if (typeof st.home.sound !== 'boolean') st.home.sound = true;
  }

  function save() {
    writeRaw(JSON.stringify(st));
    try { localStorage.setItem(KEY + '_ping', String(Date.now())); } catch (e) {}
  }

  function notify() {
    save();
    listeners.forEach(function (fn) { fn(st); });
  }

  /* ---------- 查询 ---------- */

  function taskStatus(id) {
    var t = st.tasks[id];
    return t ? t.status : 'todo';
  }

  function findTask(id) {
    return DATA.task(id) || st.customTasks.filter(function (t) { return t.id === id; })[0] || null;
  }

  function hasItem(id) { return st.unlocks.items.indexOf(id) >= 0; }
  function hasPony(id) { return st.unlocks.ponies.indexOf(id) >= 0; }

  function countBy(status) {
    return DATA.allTasks().filter(function (t) { return taskStatus(t.id) === status; }).length;
  }

  /* ---------- 动作 ---------- */

  function log(action, detail) {
    st.log.unshift({ at: Date.now(), action: action, detail: detail });
    if (st.log.length > 200) st.log.length = 200;
  }

  function submitTask(id, note) {
    if (taskStatus(id) === 'pending' || taskStatus(id) === 'approved') return false;
    st.tasks[id] = { status: 'pending', note: note || '', submitAt: Date.now(), reason: '' };
    log('提交', id);
    notify();
    return true;
  }

  function cancelSubmit(id) {
    if (taskStatus(id) !== 'pending') return false;
    delete st.tasks[id];
    log('撤回', id);
    notify();
    return true;
  }

  function applyRewards(t, unlockSet) {
    (t.rewards || []).forEach(function (r) {
      if (r.indexOf('pony:') === 0) {
        var pid = r.slice(5);
        if (st.unlocks.ponies.indexOf(pid) < 0) st.unlocks.ponies.push(pid);
      } else if (st.unlocks.items.indexOf(r) < 0) {
        st.unlocks.items.push(r);
      }
    });
  }

  function approve(id) {
    var t = findTask(id);
    if (!t) return false;
    applyRewards(t);
    st.tasks[id] = { status: 'approved', note: (st.tasks[id] && st.tasks[id].note) || '', submitAt: (st.tasks[id] && st.tasks[id].submitAt) || Date.now(), reviewAt: Date.now(), reason: '' };
    addStars((t.star || 1) * 10, '完成任务');
    addXp(15);
    log('通过', id);
    checkAchievements();
    notify();
    return true;
  }

  function reject(id, reason) {
    var t = findTask(id);
    if (!t) return false;
    st.tasks[id] = { status: 'rejected', note: (st.tasks[id] && st.tasks[id].note) || '', submitAt: (st.tasks[id] && st.tasks[id].submitAt) || Date.now(), reviewAt: Date.now(), reason: reason || '' };
    log('驳回', id);
    notify();
    return true;
  }

  function reopen(id) {
    if (!findTask(id)) return false;
    delete st.tasks[id];
    log('重置', id);
    notify();
    return true;
  }

  function setItemLock(id, unlocked) {
    if (unlocked) {
      if (!hasItem(id)) st.unlocks.items.push(id);
    } else {
      st.unlocks.items = st.unlocks.items.filter(function (x) { return x !== id; });
      /* 收回后若正穿着则脱下 */
      var it = DATA.item(id);
      if (it && st.outfit[it.slot] === id) st.outfit[it.slot] = null;
      st.looks.forEach(function (l) { if (l.outfit[it.slot] === id) l.outfit[it.slot] = null; });
    }
    log(unlocked ? '手动解锁' : '手动锁定', id);
    notify();
  }

  function setPonyLock(id, unlocked) {
    if (unlocked) {
      if (!hasPony(id)) st.unlocks.ponies.push(id);
    } else {
      st.unlocks.ponies = st.unlocks.ponies.filter(function (x) { return x !== id; });
      if (st.activePony === id) st.activePony = st.unlocks.ponies[0] || DATA.PONIES[0].id;
      st.looks.forEach(function (l) { if (l.ponyId === id) l.ponyId = st.activePony; });
    }
    log(unlocked ? '手动解锁' : '手动锁定', id);
    notify();
  }

  /* ---------- 小马家园 ---------- */

  function heartsOf(id) { return st.home.hearts[id] || 0; }

  function addHearts(id, n) {
    st.home.hearts[id] = heartsOf(id) + (n || 1);
    st.home.pets += 1;
    notify();
    return st.home.hearts[id];
  }

  function heartsTotal() {
    var t = 0;
    Object.keys(st.home.hearts).forEach(function (k) { t += st.home.hearts[k]; });
    return t;
  }

  function isDay() { return st.home.day !== false; }

  function soundOn() { return st.home.sound !== false; }

  function toggleSound() {
    st.home.sound = !soundOn();
    notify();
    return st.home.sound;
  }

  function toggleDay() {
    st.home.day = !isDay();
    log('切换昼夜', st.home.day ? '白天' : '夜晚');
    notify();
    return st.home.day;
  }

  /* ---------- 星星币 / 等级 ---------- */

  function addStars(n, why) {
    n = Math.round(n || 0);
    if (!n) return st.stars;
    st.stars += n;
    if (n > 0) {
      st.starsEarned += n;
      addXp(Math.max(1, Math.round(n / 5)));
    }
    log(n > 0 ? '获得星星' : '花掉星星', (why ? why + ' ' : '') + (n > 0 ? '+' : '') + n);
    notify();
    return st.stars;
  }

  function spendStars(n) {
    if (st.stars < n) return false;
    st.stars -= n;
    notify();
    return true;
  }

  function addXp(n) {
    st.xp += n || 0;
    var up = 0;
    while (st.xp >= DATA.xpForLevel(st.level)) {
      st.xp -= DATA.xpForLevel(st.level);
      st.level += 1;
      up += 1;
    }
    if (up) { log('升级', 'Lv.' + st.level); checkAchievements(); }
    return up;
  }

  /* ---------- 需求值（离线也会衰减） ---------- */

  var DECAY = { food: 0.55, clean: 0.35, mood: 0.45, energy: 0.4 };   /* 每分钟 */

  function needsOf(id) {
    if (!st.needs[id]) {
      /* 新来的小马状态不是满分，留出照料的余地 */
      var r = function (a, b) { return Math.round(a + Math.random() * (b - a)); };
      st.needs[id] = { food: r(78, 92), clean: r(82, 95), mood: r(80, 94), energy: r(76, 90) };
    }
    return st.needs[id];
  }

  function decayNeeds() {
    var now = Date.now();
    var mins = (now - (st.needAt || now)) / 60000;
    if (mins < 0.2) return false;
    if (mins > 480) mins = 480;                 /* 离线最多累计 8 小时 */
    st.unlocks.ponies.forEach(function (pid) {
      var n = needsOf(pid);
      DATA.NEEDS.forEach(function (k) {
        var cur = n[k.id] == null ? 100 : n[k.id];
        n[k.id] = Math.max(0, Math.min(100, cur - DECAY[k.id] * mins));
      });
    });
    st.needAt = now;
    return true;
  }

  function applyNeed(ponyId, delta, traitKey) {
    var n = needsOf(ponyId);
    var out = {};
    Object.keys(delta || {}).forEach(function (k) {
      var before = n[k] == null ? 100 : n[k];
      n[k] = Math.max(0, Math.min(100, before + delta[k]));
      out[k] = n[k] - before;
    });
    if (traitKey) {
      var t = st.traits[ponyId] || (st.traits[ponyId] = { food: 0, clean: 0, mood: 0, energy: 0, pet: 0 });
      t[traitKey] = (t[traitKey] || 0) + 1;
    }
    return out;
  }

  function traitOf(ponyId) {
    var t = st.traits[ponyId];
    if (!t) return null;
    var best = null, bv = 0;
    Object.keys(t).forEach(function (k) { if (t[k] > bv) { bv = t[k]; best = k; } });
    return bv > 0 ? best : null;
  }

  function needLevel(v) { return v >= 80 ? 'good' : (v >= 40 ? 'ok' : 'low'); }

  /* ---------- 商店 / 背包 ---------- */

  function owns(id) { return (st.bag[id] || 0) > 0; }

  function placeFurni(id) {
    var g = DATA.goods(id);
    if (!g) return;
    var n = st.room.items.length;
    var slot = n % 6;
    var x = slot < 3 ? 11 + slot * 12 : 89 - (slot - 3) * 12;
    var y = 82 + (n % 2) * 6;
    st.room.items.push({ id: id, x: x, y: y });
  }

  function buy(id) {
    var g = DATA.goods(id);
    if (!g) return { ok: false, msg: '没有这件商品' };
    if (st.level < g.lv) return { ok: false, msg: '升到 Lv.' + g.lv + ' 才能买哦' };
    if (g.cat !== 'food' && g.cat !== 'toy' && owns(id)) return { ok: false, msg: '这件已经拥有啦' };
    if (st.stars < g.price) return { ok: false, msg: '星星币不够，还差 ' + (g.price - st.stars) + ' ⭐' };
    spendStars(g.price);
    st.bag[id] = (st.bag[id] || 0) + 1;
    if (g.cat === 'furni') placeFurni(id);
    if (g.cat === 'wall') st.room.wall = id;
    if (g.cat === 'floor') st.room.floor = id;
    log('购买', g.name);
    checkAchievements();
    notify();
    return { ok: true, msg: '买到了「' + g.name + '」', goods: g };
  }

  function useItem(id, ponyId) {
    var g = DATA.goods(id);
    if (!g || !g.need) return { ok: false, msg: '这个不能用在小马身上' };
    if (!owns(id)) return { ok: false, msg: '背包里没有，先去商店买吧' };
    st.bag[id] -= 1;
    if (st.bag[id] <= 0) delete st.bag[id];
    var d = g.need;
    var traitKey = d.food ? 'food' : (d.clean ? 'clean' : 'mood');
    var changed = applyNeed(ponyId, d, traitKey);
    var hearts = g.cat === 'food' ? 1 : 2;
    st.home.hearts[ponyId] = heartsOf(ponyId) + hearts;
    st.home.pets += 1;
    addStars(g.cat === 'food' ? 1 : 2, g.name);
    log('使用', g.name);
    checkAchievements();
    notify();
    return { ok: true, goods: g, changed: changed, hearts: hearts };
  }

  function bagList() {
    return Object.keys(st.bag).filter(function (k) { return st.bag[k] > 0; }).map(function (k) {
      return { goods: DATA.goods(k), count: st.bag[k] };
    }).filter(function (x) { return x.goods; });
  }

  /* ---------- 每日打卡 ---------- */

  function checkinState() {
    var tk = todayKey();
    return {
      done: st.checkin.last === tk,
      streak: st.checkin.streak,
      next: DATA.checkinReward(st.checkin.last === tk ? st.checkin.streak : st.checkin.streak + 1)
    };
  }

  function doCheckin() {
    var tk = todayKey();
    if (st.checkin.last === tk) return null;
    var y = new Date(Date.now() - 86400000);
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    var yk = y.getFullYear() + '-' + p(y.getMonth() + 1) + '-' + p(y.getDate());
    st.checkin.streak = (st.checkin.last === yk) ? st.checkin.streak + 1 : 1;
    st.checkin.last = tk;
    var reward = DATA.checkinReward(st.checkin.streak);
    addStars(reward, '每日打卡');
    addXp(10);
    log('打卡', '连续 ' + st.checkin.streak + ' 天');
    checkAchievements();
    notify();
    return { streak: st.checkin.streak, reward: reward };
  }

  /* ---------- 成就 ---------- */

  var pendingAch = [];
  function hasAch(id) { return !!st.achievements[id]; }

  function grant(id) {
    if (hasAch(id)) return false;
    var a = DATA.achievement(id);
    if (!a) return false;
    st.achievements[id] = Date.now();
    st.stars += a.stars;
    st.starsEarned += a.stars;
    log('成就达成', a.name);
    pendingAch.push(a);
    return true;
  }

  function takePendingAch() { var a = pendingAch.slice(); pendingAch = []; return a; }

  function checkAchievements() {
    var got = false;
    var maxHeart = 0;
    Object.keys(st.home.hearts).forEach(function (k) { maxHeart = Math.max(maxHeart, st.home.hearts[k]); });
    var approved = 0;
    Object.keys(st.tasks).forEach(function (k) { if (st.tasks[k].status === 'approved') approved += 1; });

    var allNeedsOk = st.unlocks.ponies.length > 0;
    st.unlocks.ponies.forEach(function (pid) {
      var n = st.needs[pid];
      if (!n) { allNeedsOk = false; return; }
      DATA.NEEDS.forEach(function (k) { if ((n[k.id] == null ? 100 : n[k.id]) < 80) allNeedsOk = false; });
    });
    /* 刚解锁还从没照料过的小马按满值算，避免误判 */
    if (!st.unlocks.ponies.length) allNeedsOk = false;

    if (st.home.pets > 0) got = grant('a-pet') || got;
    if (maxHeart >= 50) got = grant('a-friend') || got;
    if (maxHeart >= 200) got = grant('a-best') || got;
    if (st.unlocks.ponies.length >= DATA.PONIES.length) got = grant('a-allpony') || got;
    if (st.unlocks.items.length >= 20) got = grant('a-wardrobe') || got;
    if (approved >= 5) got = grant('a-task5') || got;
    if (approved >= 15) got = grant('a-task15') || got;
    if (st.starsEarned >= 500) got = grant('a-rich') || got;
    if (st.room.items.length >= 5) got = grant('a-designer') || got;
    if (st.gameBest.star >= 30) got = grant('a-star30') || got;
    if (st.gameBest.memory > 0 && st.gameBest.memory <= 12) got = grant('a-memory') || got;
    if (st.checkin.streak >= 7) got = grant('a-streak7') || got;
    if (st.album.length >= 3) got = grant('a-photo') || got;
    if (allNeedsOk) got = grant('a-full') || got;
    if (st.level >= 5) got = grant('a-level5') || got;
    if (st.potty && st.potty.uses >= 1) got = grant('a-potty') || got;
    if (st.potty && st.potty.washes >= 10) got = grant('a-wash') || got;

    if (got) notify();
    return got;
  }

  /* ---------- 房间装饰与相册 ---------- */

  function setWall(id) { if (owns(id)) { st.room.wall = id; notify(); return true; } return false; }
  function setFloor(id) { if (owns(id)) { st.room.floor = id; notify(); return true; } return false; }

  /* 房间是否已经摆上了某件家具（买来但没摆的不算） */
  function hasFurni(id) {
    for (var i = 0; i < st.room.items.length; i++) {
      if (st.room.items[i].id === id) return true;
    }
    return false;
  }

  /* ---------- 如厕 / 洗手 计数 ---------- */

  function pottyCount() { return st.potty.uses; }
  function washCount() { return st.potty.washes; }

  function markPotty() {
    st.potty.uses += 1;
    addStars(2);
    addXp(3);
    log('如厕', '第 ' + st.potty.uses + ' 次');
    checkAchievements();
    notify();
  }

  function markWash() {
    st.potty.washes += 1;
    addStars(1);
    log('洗手', '第 ' + st.potty.washes + ' 次');
    checkAchievements();
    notify();
  }

  function moveFurni(i, x, y) {
    var it = st.room.items[i];
    if (!it) return false;
    it.x = Math.max(6, Math.min(94, x));
    it.y = Math.max(72, Math.min(96, y));
    notify();
    return true;
  }

  function takePhoto(name) {
    var rec = {
      name: name || '家园快照',
      at: Date.now(),
      wall: st.room.wall,
      floor: st.room.floor,
      weather: st.weather,
      day: st.home.day,
      ponies: st.unlocks.ponies.map(function (pid) { return { id: pid, hearts: heartsOf(pid) }; })
    };
    st.album.unshift(rec);
    if (st.album.length > 12) st.album.length = 12;
    log('拍照', rec.name);
    checkAchievements();
    notify();
    return rec;
  }

  function removePhoto(i) { st.album.splice(i, 1); notify(); }

  function setGameBest(kind, v) {
    if (kind === 'star') {
      st.gameBest.star = Math.max(st.gameBest.star || 0, v);
      addStars(Math.round(v / 3) + 2, '抓星星');
    } else if (kind === 'memory') {
      st.gameBest.memory = st.gameBest.memory ? Math.min(st.gameBest.memory, v) : v;
      addStars(Math.max(5, 24 - v), '记忆翻牌');
    }
    checkAchievements();
    notify();
  }

  /* ---------- 破解开关：一键解锁 / 一键还原 ---------- */

  function unlockEverything() {
    DATA.ITEMS.forEach(function (i) {
      if (st.unlocks.items.indexOf(i.id) < 0) st.unlocks.items.push(i.id);
    });
    DATA.PONIES.forEach(function (p) {
      if (st.unlocks.ponies.indexOf(p.id) < 0) st.unlocks.ponies.push(p.id);
    });
  }

  /* 关闭破解时，把当前身上 / 造型里已经没有权限的饰品脱下来 */
  function stripLockedOutfit() {
    Object.keys(st.outfit).forEach(function (k) {
      var v = st.outfit[k];
      if (!v) return;
      if (k === 'bg') {
        if (!hasItem(v)) {
          var firstBg = st.unlocks.items.filter(function (id) {
            var it = DATA.item(id);
            return it && it.slot === 'bg';
          })[0];
          st.outfit.bg = firstBg || 'bg-sky';
        }
        return;
      }
      if (!hasItem(v)) st.outfit[k] = null;
    });
  }

  function setCheat(on) {
    on = !!on;
    if (on === !!st.cheat) return false;

    if (on) {
      /* 先快照，关闭时精确还原，不误伤孩子自己挣来的东西 */
      st.cheatBackup = {
        items: st.unlocks.items.slice(),
        ponies: st.unlocks.ponies.slice(),
        activePony: st.activePony
      };
      unlockEverything();
      st.cheat = true;
      log('破解开启', '解锁全部');
    } else {
      var b = st.cheatBackup || { items: initials('item'), ponies: initials('pony'), activePony: st.activePony };
      st.unlocks.items = b.items.filter(function (id) { return !!DATA.item(id); });
      st.unlocks.ponies = b.ponies.filter(function (id) { return !!DATA.pony(id); });
      if (!st.unlocks.ponies.length) st.unlocks.ponies = initials('pony');
      if (!st.unlocks.items.length) st.unlocks.items = initials('item');
      st.activePony = hasPony(b.activePony) ? b.activePony : st.unlocks.ponies[0];
      stripLockedOutfit();
      st.cheatBackup = null;
      st.cheat = false;
      log('破解关闭', '恢复原状');
    }
    notify();
    return true;
  }

  function cheatOn() { return !!st.cheat; }

  function addCustomTask(title, desc, rewards) {
    var id = 'c' + Date.now().toString(36);
    st.customTasks.unshift({ id: id, title: title, desc: desc || '', tag: '自定义', custom: true, rewards: rewards || [] });
    log('新增任务', title);
    notify();
    return id;
  }

  function removeCustomTask(id) {
    var before = st.customTasks.length;
    st.customTasks = st.customTasks.filter(function (t) { return t.id !== id; });
    delete st.tasks[id];
    log('删除任务', id);
    notify();
    return st.customTasks.length < before;
  }

  function saveLook(name) {
    st.looks.unshift({ name: name, ponyId: st.activePony, outfit: JSON.parse(JSON.stringify(st.outfit)) });
    if (st.looks.length > 8) st.looks.length = 8;
    log('保存造型', name);
    notify();
  }

  function loadLook(idx) {
    var l = st.looks[idx];
    if (!l) return false;
    /* 只加载当前已解锁的部分 */
    st.activePony = hasPony(l.ponyId) ? l.ponyId : st.activePony;
    Object.keys(l.outfit).forEach(function (k) {
      var v = l.outfit[k];
      if (!v) { st.outfit[k] = null; return; }
      if (k === 'bg') { st.outfit.bg = hasItem(v) ? v : st.outfit.bg; return; }
      st.outfit[k] = hasItem(v) ? v : null;
    });
    notify();
    return true;
  }

  function removeLook(idx) {
    st.looks.splice(idx, 1);
    notify();
  }

  function resetAll() {
    st = seed();
    notify();
  }

  function exportJSON() {
    return JSON.stringify(st, null, 2);
  }

  function importJSON(text) {
    try {
      var o = JSON.parse(text);
      if (!o || typeof o !== 'object' || !o.unlocks) return false;
      st = o;
      load();
      notify();
      return true;
    } catch (e) {
      return false;
    }
  }

  function stats() {
    return {
      total: DATA.allTasks().length,
      pending: countBy('pending'),
      approved: countBy('approved'),
      rejected: countBy('rejected'),
      todo: countBy('todo'),
      items: st.unlocks.items.length,
      itemsTotal: DATA.ITEMS.length,
      ponies: st.unlocks.ponies.length,
      poniesTotal: DATA.PONIES.length
    };
  }

  load();
  decayNeeds();
  save();

  window.Store = {
    key: KEY,
    ok: function () { return storageOK; },
    state: function () { return st; },
    save: notify,
    onChange: function (fn) { listeners.push(fn); },
    taskStatus: taskStatus,
    findTask: findTask,
    allTasks: function () { return DATA.allTasks(); },
    customTasks: function () { return st.customTasks; },
    hasItem: hasItem,
    hasPony: hasPony,
    submitTask: submitTask,
    cancelSubmit: cancelSubmit,
    approve: approve,
    reject: reject,
    reopen: reopen,
    setItemLock: setItemLock,
    setPonyLock: setPonyLock,
    setCheat: setCheat,
    cheatOn: cheatOn,
    addCustomTask: addCustomTask,
    removeCustomTask: removeCustomTask,
    stars: function () { return st.stars; },
    addStars: addStars,
    spendStars: spendStars,
    addXp: addXp,
    level: function () { return st.level; },
    xp: function () { return st.xp; },
    needsOf: needsOf,
    decayNeeds: decayNeeds,
    applyNeed: applyNeed,
    traitOf: traitOf,
    needLevel: needLevel,
    owns: owns,
    bagList: bagList,
    buy: buy,
    useItem: useItem,
    checkinState: checkinState,
    doCheckin: doCheckin,
    hasAch: hasAch,
    takePendingAch: takePendingAch,
    checkAchievements: checkAchievements,
    setWall: setWall,
    setFloor: setFloor,
    hasFurni: hasFurni,
    pottyCount: pottyCount,
    washCount: washCount,
    markPotty: markPotty,
    markWash: markWash,
    moveFurni: moveFurni,
    takePhoto: takePhoto,
    removePhoto: removePhoto,
    setGameBest: setGameBest,
    weather: function () { return DATA.weather(st.weather); },
    heartsOf: heartsOf,
    addHearts: addHearts,
    heartsTotal: heartsTotal,
    isDay: isDay,
    soundOn: soundOn,
    toggleSound: toggleSound,
    toggleDay: toggleDay,
    saveLook: saveLook,
    loadLook: loadLook,
    removeLook: removeLook,
    resetAll: resetAll,
    exportJSON: exportJSON,
    importJSON: importJSON,
    stats: stats
  };

  /* 跨标签页同步 */
  window.addEventListener('storage', function (e) {
    if (e.key === KEY) {
      load();
      listeners.forEach(function (fn) { fn(st, true); });
    }
  });
})();

</script>
<script>
/* ===== js/home.js ===== */
/**
 * 小马家园 · 云上城堡
 * 已解锁的小马住在云上的房间里：会自己走动、聊天、表达需求；
 * 可以摸摸、喂食、洗澡、玩耍、哄睡，还可以买家具摆进房间。
 */
(function () {
  'use strict';

  var D = window.DATA, S = window.Store, A = window.Avatar;

  /* ---------------- 台词 ---------------- */

  var LINES = {
    twilight: ['今天读了一本很棒的书！', '要不要一起学魔法？', '这里的阳光真暖和～', '我给故事想了个新结局！'],
    rainbowdash: ['我是飞得最快的！', '来比赛跑步吧！', '嗖——我刚才绕了一圈！', '今天天气太适合飞了～'],

        '<circle cx="47" cy="31" r="3.6" fill="#a9c4e0"/>' +

        '<rect x="30" y="70" width="16" height="10" fill="#eef4fb"/>' +
        '<rect x="59" y="57" width="10" height="17" rx="3" fill="#ffb8d4"/>';
    },
    'u-piano': function () {
      var keys = '', i;
      for (i = 0; i < 11; i++) {
        keys += '<rect x="' + (10 + i * 10) + '" y="62" width="9" height="24" rx="2" fill="#fff" stroke="#e5dff0" stroke-width="1"/>';
      }
      return '<ellipse cx="62" cy="90" rx="56" ry="6" fill="#000" opacity=".08"/>' +
        '<rect x="6" y="16" width="112" height="52" rx="8" fill="#8f7bd4"/>' +
        '<rect x="6" y="16" width="112" height="12" rx="6" fill="#a894e6"/>' +
        '<rect x="6" y="60" width="112" height="30" rx="6" fill="#f6f1ff"/>' + keys +
        '<circle cx="20" cy="34" r="6" fill="#ffd166"/><circle cx="100" cy="34" r="6" fill="#ff8fa3"/>';
    },
    'u-plant': function () {
      return '<ellipse cx="26" cy="70" rx="20" ry="5" fill="#000" opacity=".08"/>' +
        '<path d="M14,38 h24 l-4,32 h-16 Z" fill="#e08b6a"/>' +
        '<rect x="11" y="34" width="30" height="8" rx="3" fill="#f0a483"/>' +
        '<path d="M26,34 q-18,-6 -14,-24 q16,2 18,16 Z" fill="#7ecfa8"/>' +
        '<path d="M26,34 q16,-8 12,-26 q-14,4 -16,20 Z" fill="#9adcb8"/>' +
        '<circle cx="26" cy="10" r="5" fill="#ffd166"/>';
    }
  };

  function furniSVG(g) {
    var f = FURNI[g.id];
    var w = g.w || 90, h = g.h || 80;
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">' +
      (f ? f(w, h) : '<rect x="2" y="2" width="' + (w - 4) + '" height="' + (h - 4) + '" rx="8" fill="#e8d9f5"/>') +
      '</svg>';
  }

  /* ---------------- 房间 ---------------- */

  function roomArt(isDay) {
    var st = S.state();
    var wall = wallTone(st.room.wall);
    var floor = wallTone(st.room.floor);
    var weather = S.weather();
    return '' +
      '<svg class="room-art" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="0" y="0" width="800" height="332" fill="' + wall + '"/>' +
      '<g class="wall-pat">' + wallArt(st.room.wall) + '</g>' +
      '<rect x="0" y="318" width="800" height="14" fill="#fff" opacity=".75"/>' +
      '<g fill="#fff" opacity=".85">' +
      '<ellipse cx="60" cy="326" rx="34" ry="10"/><ellipse cx="96" cy="322" rx="24" ry="9"/>' +
      '<ellipse cx="740" cy="326" rx="34" ry="10"/><ellipse cx="704" cy="322" rx="24" ry="9"/>' +
      '<ellipse cx="300" cy="328" rx="26" ry="8"/><ellipse cx="500" cy="328" rx="26" ry="8"/></g>' +
      '<rect x="0" y="332" width="800" height="118" fill="' + floor + '"/>' +
      '<g class="floor-pat">' + floorArt(st.room.floor) + '</g>' +
      '<path class="sun-patch" d="M470,332 L600,332 L660,450 L430,450 Z" fill="#fff6c8" opacity="' + (isDay ? '.32' : '0') + '"/>' +
      windowArt(isDay, weather) +
      '<g class="night-only"><circle cx="150" cy="290" r="98" fill="url(#lampG)"/></g>' +
      '<rect class="night-veil" x="0" y="0" width="800" height="450" fill="#2b2456"/>' +
      '<g class="front-cloud" opacity=".9">' +
      '<ellipse cx="40" cy="446" rx="90" ry="26" fill="#fff"/><ellipse cx="110" cy="436" rx="56" ry="22" fill="#fff"/>' +
      '<ellipse cx="760" cy="446" rx="90" ry="26" fill="#fff"/><ellipse cx="690" cy="436" rx="56" ry="22" fill="#fff"/>' +
      '</g>' +
      '</svg>';
  }

  /* ---------------- 小马 ---------------- */

  function randomOutfit() {
    var o = {};
    D.CATS.forEach(function (c) {
      if (c.id === 'bg') return;
      var pool = D.bySlot(c.id).filter(function (i) { return S.hasItem(i.id); });
      if (pool.length && Math.random() < 0.55) o[c.id] = one(pool).id;
    });
    return o;
  }

  function makeUnit(p) {
    var u = {
      id: p.id,
      outfit: randomOutfit(),
      x: rnd(24, 76), y: rnd(78, 90),
      tx: rnd(24, 76), ty: rnd(78, 90),
      walking: false, wait: rnd(0.4, 2.4),
      bubble: rnd(3, 10), bubbleT: 0, pet: 0,
      target: null, busy: 0, sleep: 0,
      bladder: rnd(0, 22), potty: 0   /* 便意 0~100；potty: 0无 1去马桶 2使用中 3去洗手 */
    };
    var wrap = document.createElement('div');
    wrap.className = 'hm-pony';
    wrap.setAttribute('data-hp', p.id);
    wrap.innerHTML =
      '<span class="hm-shadow"></span>' +
      '<span class="hm-inner">' + A.render({ ponyId: p.id, outfit: u.outfit, width: 104 }) + '</span>' +
      '<span class="hm-name">' + p.name + '<i>♥<b>' + S.heartsOf(p.id) + '</b></i></span>' +
      '<span class="hm-flag"></span>' +
      '<span class="hm-bubble"></span>';
    u.el = wrap;
    return u;
  }

  function draw(u) {
    var s = 0.76 + (u.y - 74) / 21 * 0.4;
    u.el.style.left = u.x.toFixed(2) + '%';
    u.el.style.top = u.y.toFixed(2) + '%';
    u.el.style.zIndex = String(Math.round(u.y * 10));
    u.el.style.transform = 'translate(-50%,-100%) scale(' + s.toFixed(3) + ')';
    u.el.classList.toggle('walk', u.walking);

    var n = S.needsOf(u.id);
    var flag = '', cls = '';
    if (u.potty === 2) { flag = '🚽'; cls = 'potty'; }
    else if (u.bladder >= POTTY_FLAG) { flag = '🚽'; cls = 'potty'; }
    else if (n.food < 40) { flag = '🍎'; cls = 'hung'; }
    else if (n.clean < 40) { flag = '🛁'; cls = 'dirty'; }
    else if (n.energy < 35) { flag = '💤'; cls = 'tired'; }
    else if (n.mood < 40) { flag = '💔'; cls = 'sad'; }
    var fl = u.el.querySelector('.hm-flag');
    if (fl) {
      fl.textContent = u.sleep > 0 ? '💤' : flag;
      fl.className = 'hm-flag ' + (u.sleep > 0 ? 'sleep' : cls) + (flag || u.sleep > 0 ? ' show' : '');
    }
    u.el.classList.toggle('sleeping', u.sleep > 0);
    u.el.classList.toggle('dirty', n.clean < 35 && u.sleep <= 0);
  }

  function say(u, text, dur) {
    var b = u.el.querySelector('.hm-bubble');
    if (!b) return;
    b.textContent = text;
    b.classList.add('show');
    u.bubbleT = dur || 2.4;
  }

  function jump(u) {
    u.el.classList.remove('jump');
    void u.el.offsetWidth;
    u.el.classList.add('jump');
    setTimeout(function () { u.el.classList.remove('jump'); }, 560);
  }

  function updateHearts(u) {
    var b = u.el.querySelector('.hm-name b');
    if (b) b.textContent = S.heartsOf(u.id);
    renderStats();
  }

  /* ---------------- 房间里的设施 ---------------- */

  /* 房间是否摆上了某件家具，返回它的摆放位置（百分比） */
  function furniSpot(id) {
    var items = S.state().room.items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return items[i];
    }
    return null;
  }

  /* 小马站到家具前面时的落脚点 */
  function standSpot(it) {
    return { x: clamp(it.x, 18, 84), y: clamp(it.y + 8, 78, 92) };
  }

  /* 家具对应的 DOM 节点，用来打闪光 */
  function furniEl(id) {
    if (!furniLayer) return null;
    var items = S.state().room.items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return furniLayer.querySelector('[data-fi="' + i + '"]');
    }
    return null;
  }

  /* 成就达成时立刻弹提示（由 app.js 提供） */
  function popAch() {
    if (window.App && window.App.popAch) window.App.popAch();
  }

  function sparkleFurni(id) {
    var el = furniEl(id);
    if (!el) return;
    el.classList.remove('sparkle');
    void el.offsetWidth;
    el.classList.add('sparkle');
    setTimeout(function () { el.classList.remove('sparkle'); }, 1400);
  }

  /* ---------------- 上厕所 / 洗手 ---------------- */

  /* 让小马走向马桶；没马桶就提示去买。返回是否出发 */
  function gotoPotty(u) {
    if (u.sleep > 0) { say(u, 'Zzz…等一下…', 1.8); return false; }
    if (u.potty === 2) return false;
    var it = furniSpot('u-toilet');
    if (!it) {
      toast('房间里还没有马桶，去星星商店买一个「🚽 云朵马桶」吧～');
      say(u, one(POTTY_NONE), 2.8);
      return false;
    }
    var s = standSpot(it);
    u.tx = s.x; u.ty = s.y;
    u.walking = true; u.wait = 0; u.target = null; u.potty = 1;
    say(u, one(POTTY_LINES), 2.4);
    return true;
  }

  function usePotty(u) {
    u.potty = 2;
    u.walking = false;
    u.busy = 2.8;
    u.bladder = 0;
    u.el.classList.add('pottying');
    sfxPotty();
    say(u, '嗯……好啦！', 2.6);
    popFx('💧', u.x, u.y - 14);
    setTimeout(function () { popFx('✨', u.x + 5, u.y - 22); }, 520);
    setTimeout(function () { popFx('🚽', u.x - 5, u.y - 26); }, 950);
    sparkleFurni('u-toilet');

    S.markPotty();
    S.applyNeed(u.id, { mood: 6, clean: -4, energy: 2 });
    S.addHearts(u.id, 1);
    updateHearts(u);
    popAch();

    setTimeout(function () {
      u.el.classList.remove('pottying');
      u.busy = 0;
      var sink = furniSpot('u-sink');
      if (sink) {
        var s = standSpot(sink);
        u.tx = s.x; u.ty = s.y; u.walking = true; u.potty = 3;
        say(u, '去洗个手～', 2);
      } else {
        u.potty = 0;
        say(u, '舒服多啦！', 2.2);
        u.wait = rnd(0.8, 2);
      }
    }, 2800);
    toast('自己上厕所啦，真棒！+2⭐');
  }

  function washHands(u) {
    u.potty = 0;
    u.walking = false;
    u.busy = 2.2;
    u.el.classList.add('washing');
    sfxWash();
    say(u, one(WASH_LINES), 2.4);
    for (var i = 0; i < 6; i++) {
      (function (k) {
        setTimeout(function () { popFx('🫧', u.x + rnd(-10, 10), u.y - 8 - rnd(0, 26)); }, k * 150);
      })(i);
    }
    sparkleFurni('u-sink');
    S.markWash();
    S.applyNeed(u.id, { clean: 10, mood: 3 }, 'clean');
    popAch();
    setTimeout(function () {
      u.el.classList.remove('washing');
      u.busy = 0;
      u.wait = rnd(0.8, 2);
    }, 2200);
    toast('上完厕所洗手，讲卫生！+1⭐');
  }

  /* ---------------- 互动 ---------------- */

  function pet(u) {
    if (u.sleep > 0) { say(u, 'Zzz…别吵…', 1.8); return; }
    u.pet += 1;
    S.addHearts(u.id, 1);
    S.applyNeed(u.id, { mood: 4 }, 'pet');
    updateHearts(u);
    sfxPet();
    jump(u);
    say(u, one(PET_LINES), 2.2);
    popFx('♥', u.x + rnd(-3, 3), u.y - 22);
    if (u.pet % 5 === 0) {
      sfxCheer();
      say(u, '我们是好朋友！', 3);
      for (var i = 0; i < 6; i++) {
        (function (k) {
          setTimeout(function () { popFx(['🌈', '✨', '💖', '⭐'][k % 4], u.x + rnd(-14, 14), u.y - 24 - k * 4); }, k * 90);
        })(i);
      }
    }
    units.forEach(function (o) {
      if (o === u || Math.random() > 0.45) return;
      o.tx = clamp(u.x + rnd(-9, 9), 18, 84);
      o.ty = clamp(u.y + rnd(-3, 3), 78, 92);
      o.walking = true; o.wait = 0; o.target = null;
    });
  }

  function give(u, goodsId) {
    if (u.sleep > 0) { say(u, 'Zzz…等一下…', 1.8); return; }
    var r = S.useItem(goodsId, u.id);
    if (!r.ok) { toast(r.msg); return; }
    var g = r.goods;
    updateHearts(u);
    jump(u);
    if (g.cat === 'food') {
      sfxEat();
      say(u, one(EAT_LINES), 2.4);
      popFx(g.icon, u.x, u.y - 18);
      popFx('♥', u.x + rnd(-4, 4), u.y - 24);
      u.bladder = Math.min(100, u.bladder + 24);   /* 吃饱喝足，过会儿就该上厕所了 */
    } else {
      sfxPlay();
      say(u, one(PLAY_LINES), 2.4);
      popFx(g.icon, u.x + rnd(-5, 5), u.y - 20);
      popFx('🎵', u.x + rnd(-8, 8), u.y - 26);
      u.busy = 1.4;
    }
    toast(g.name + ' 用掉啦，' + (g.cat === 'food' ? '吃饱饱' : '玩得开心') + ' +' + r.hearts + '♥');
  }

  function bath(u) {
    if (u.sleep > 0) { say(u, 'Zzz…', 1.6); return; }
    S.applyNeed(u.id, { clean: 45, mood: 6 }, 'clean');
    sfxBath();
    u.busy = 2.2;
    u.el.classList.add('bathing');
    say(u, one(BATH_LINES), 2.6);
    for (var i = 0; i < 10; i++) {
      (function (k) {
        setTimeout(function () { popFx('🫧', u.x + rnd(-14, 14), u.y - 10 - rnd(0, 34)); }, k * 170);
      })(i);
    }
    setTimeout(function () { u.el.classList.remove('bathing'); }, 2400);
    toast('洗得香喷喷的✨');
  }

  function sleep(u) {
    if (u.sleep > 0) return;
    u.sleep = 6;
    u.walking = false;
    u.wait = 6;
    S.applyNeed(u.id, { energy: 55, mood: 5 }, 'energy');
    sfxSleep();
    say(u, one(SLEEP_LINES), 3);
    var i = 0;
    var timer = setInterval(function () {
      i += 1;
      if (!mounted || i > 6) { clearInterval(timer); return; }
      popFx('💤', u.x + 6, u.y - 26 - i * 3);
    }, 900);
    setTimeout(function () { u.sleep = 0; u.wait = 0.6; }, 6000);
    toast('哄睡中…（6 秒后精神满满）');
  }

  /* ---------------- 零食 / 特效 / 惊喜 ---------------- */

  function dropSnacks(n) {
    for (var i = 0; i < (n || 3); i++) {
      var x = rnd(24, 76), y = rnd(80, 92);
      var el = document.createElement('span');
      el.className = 'snack';
      el.textContent = one(SNACKS);
      el.style.left = x + '%';
      el.style.top = y + '%';
      snackLayer.appendChild(el);
      snacks.push({ x: x, y: y, el: el });
    }
    units.forEach(function (u) {
      var s = nearestSnack(u);
      if (s && u.sleep <= 0) { u.target = s; u.walking = true; u.wait = 0; }
    });
  }

  function nearestSnack(u) {
    var best = null, bd = 1e9, i, d;
    for (i = 0; i < snacks.length; i++) {
      d = Math.abs(snacks[i].x - u.x) + Math.abs(snacks[i].y - u.y);
      if (d < bd) { bd = d; best = snacks[i]; }
    }
    return best;
  }

  function eat(u, s) {
    var idx = snacks.indexOf(s);
    if (idx < 0) return;
    snacks.splice(idx, 1);
    s.el.classList.add('gone');
    setTimeout(function () { if (s.el.parentNode) s.el.parentNode.removeChild(s.el); }, 400);
    S.addHearts(u.id, 2);
    S.applyNeed(u.id, { food: 18, mood: 5 }, 'food');
    u.bladder = Math.min(100, u.bladder + 18);   /* 吃完东西更容易想上厕所 */
    updateHearts(u);
    sfxEat();
    jump(u);
    say(u, one(EAT_LINES), 2.4);
    popFx('♥', u.x + rnd(-3, 3), u.y - 22);
    popFx('✨', u.x + rnd(-6, 6), u.y - 26);
  }

  function popFx(text, x, y) {
    if (!fxLayer) return;
    var e = document.createElement('span');
    e.className = 'fx';
    e.textContent = text;
    e.style.left = clamp(x, 4, 96) + '%';
    e.style.top = clamp(y, 4, 96) + '%';
    fxLayer.appendChild(e);
    setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 2600);
  }

  function ambientFx() {
    var night = !S.isDay();
    var pool = night ? ['⭐', '✨', '💫', '🌙'] : ['🎵', '✨', '🌸', '🦋'];
    popFx(one(pool), rnd(10, 90), rnd(20, 60));
  }

  function spawnGift() {
    if (!fxLayer) return;
    var e = document.createElement('span');
    e.className = 'gift';
    e.textContent = Math.random() < 0.5 ? '⭐' : '🎁';
    e.style.left = rnd(18, 82) + '%';
    e.style.top = rnd(24, 58) + '%';
    e.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var n = 5 + Math.floor(Math.random() * 6);
      S.addStars(n, '捡到惊喜');
      sfxCoin();
      popFx('⭐+' + n, parseFloat(e.style.left), parseFloat(e.style.top));
      toast('捡到惊喜！星星币 +' + n);
      renderStats();
      if (e.parentNode) e.parentNode.removeChild(e);
    });
    fxLayer.appendChild(e);
    setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 9000);
  }

  /* ---------------- 菜单 / 档案 ---------------- */

  function closeMenu() {
    if (!root) return;
    var m = root.querySelector('.pony-menu');
    if (m && m.parentNode) m.parentNode.removeChild(m);
    var c = root.querySelector('.pony-card');
    if (c && c.parentNode) c.parentNode.removeChild(c);
  }

  function heartLevel(id) { return Math.min(5, 1 + Math.floor(S.heartsOf(id) / 40)); }

  function openMenu(u) {
    closeMenu();
    var bag = S.bagList().filter(function (b) { return b.goods.cat === 'food' || b.goods.cat === 'toy'; });
    var foods = bag.filter(function (b) { return b.goods.cat === 'food'; });
    var toys = bag.filter(function (b) { return b.goods.cat === 'toy'; });

    var m = document.createElement('div');
    m.className = 'pony-menu';
    m.innerHTML =
      '<div class="pm-title">' + esc(D.pony(u.id).name) + '<em>亲密度 Lv.' + heartLevel(u.id) + '</em></div>' +
      '<div class="pm-row">' +
      '  <button class="pm-btn" data-pm="pet" type="button">🫶 摸摸</button>' +
      '  <button class="pm-btn" data-pm="bath" type="button">🛁 洗澡</button>' +
      '  <button class="pm-btn" data-pm="sleep" type="button">💤 哄睡</button>' +
      '  <button class="pm-btn' + (u.bladder >= POTTY_FLAG ? ' warn' : '') + '" data-pm="potty" type="button">🚽 ' +
        (u.bladder >= POTTY_FLAG ? '快憋不住' : '上厕所') + '</button>' +
      '  <button class="pm-btn" data-pm="info" type="button">📋 档案</button>' +
      '</div>' +
      '<div class="pm-label">喂食</div>' +
      '<div class="pm-row">' + (foods.length ? foods.map(function (b) {
        return '<button class="pm-btn food" data-use="' + b.goods.id + '" type="button">' + b.goods.icon + ' ' +
          esc(b.goods.name) + ' ×' + b.count + '</button>';
      }).join('') : '<span class="pm-empty">背包里没有吃的，去星星商店买～</span>') + '</div>' +
      '<div class="pm-label">玩耍</div>' +
      '<div class="pm-row">' + (toys.length ? toys.map(function (b) {
        return '<button class="pm-btn toy" data-use="' + b.goods.id + '" type="button">' + b.goods.icon + ' ' +
          esc(b.goods.name) + ' ×' + b.count + '</button>';
      }).join('') : '<span class="pm-empty">还没有玩具，商店里有皮球和秋千～</span>') + '</div>';

    m.addEventListener('click', function (e) {
      var t = e.target;
      var b = t.closest ? t.closest('[data-use]') : null;
      if (b) { give(u, b.getAttribute('data-use')); closeMenu(); return; }
      var pm = t.closest ? t.closest('[data-pm]') : null;
      if (!pm) return;
      var act = pm.getAttribute('data-pm');
      if (act === 'pet') { pet(u); closeMenu(); }
      else if (act === 'bath') { bath(u); closeMenu(); }
      else if (act === 'sleep') { sleep(u); closeMenu(); }
      else if (act === 'potty') {
        closeMenu();
        if (u.bladder < 18) say(u, '现在还不想上厕所呢～', 2.2);
        else gotoPotty(u);
      }
      else if (act === 'info') { closeMenu(); openCard(u); }
    });
    root.appendChild(m);
  }

  function openCard(u) {
    var n = S.needsOf(u.id);
    var tr = S.traitOf(u.id);
    var trait = tr ? D.TRAITS[tr] : null;
    var c = document.createElement('div');
    c.className = 'pony-card';
    c.innerHTML =
      '<div class="pc-head"><b>' + esc(D.pony(u.id).name) + '</b>' +
      '<span>' + esc(D.pony(u.id).race) + ' · 亲密度 Lv.' + heartLevel(u.id) + '</span>' +
      '<button class="pc-close" data-close type="button">×</button></div>' +
      '<div class="pc-art">' + A.render({ ponyId: u.id, outfit: u.outfit, width: 96 }) + '</div>' +
      '<div class="pc-needs">' + D.NEEDS.map(function (k) {
        var v = Math.round(n[k.id]);
        return '<div class="need ' + S.needLevel(v) + '"><span>' + k.icon + ' ' + k.name + '</span>' +
          '<i><b style="width:' + v + '%"></b></i><em>' + v + '</em></div>';
      }).join('') +
        /* 便意越高越急，颜色按「剩余舒适值」反着算 */
        '<div class="need ' + S.needLevel(100 - Math.round(u.bladder)) + '">' +
        '<span>🚽 便意</span><i><b style="width:' + Math.round(u.bladder) + '%"></b></i>' +
        '<em>' + Math.round(u.bladder) + '</em></div>' +
      '</div>' +
      '<div class="pc-meta">' +
      '  <div>爱心 <b>' + S.heartsOf(u.id) + '</b></div>' +
      '  <div>性格 <b>' + (trait ? trait.name : '还在观察中') + '</b>' +
      (trait ? '<i>' + esc(trait.desc) + '</i>' : '') + '</div>' +
      '</div>';
    c.addEventListener('click', function (e) {
      if ((e.target.closest && e.target.closest('[data-close]')) || e.target === c) {
        if (c.parentNode) c.parentNode.removeChild(c);
      }
    });
    root.appendChild(c);
  }

  /* ---------------- 循环 ---------------- */

  function step(u, dt) {
    var n = S.needsOf(u.id);

    if (u.sleep > 0) {
      u.sleep -= dt;
      if (u.sleep <= 0) { u.sleep = 0; u.wait = 0.5; say(u, '睡饱啦！', 2); }
      draw(u);
      return;
    }
    if (u.busy > 0) u.busy -= dt;

    /* 便意随时间上涨，睡着时涨得慢一点 */
    u.bladder = Math.min(100, u.bladder + dt * POTTY_RATE * (u.sleep > 0 ? 0.45 : 1));

    var speed = 15 * (n.mood < 35 ? 0.6 : 1) * (n.energy < 35 ? 0.7 : 1);

    if (u.walking) {
      var dx = u.tx - u.x, dy = u.ty - u.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var sp = speed * dt;
      if (d <= sp + 0.5) {
        u.x = u.tx; u.y = u.ty;
        u.walking = false;
        u.wait = rnd(0.9, 3.2);
        if (u.potty === 1) usePotty(u);
        else if (u.potty === 3) washHands(u);
        else if (u.target) { var s = u.target; u.target = null; eat(u, s); }
      } else {
        u.x += dx / d * sp;
        u.y += dy / d * sp;
      }
    } else {
      u.wait -= dt;
      if (u.wait <= 0 && u.busy <= 0) {
        var sn = nearestSnack(u);
        if (u.potty === 0 && u.bladder >= POTTY_URGE && furniSpot('u-toilet')) {
          gotoPotty(u);                                  /* 憋不住了，自己跑去厕所 */
        } else if (sn) { u.tx = sn.x; u.ty = sn.y; u.target = sn; }
        else if (n.energy < 25) { u.sleep = 5; say(u, one(TIRED), 2.6); }
        else if (!S.isDay() && Math.random() < 0.4) {
          u.tx = rnd(38, 62); u.ty = rnd(84, 91); say(u, one(SLEEP_LINES), 2.8);
        } else { u.tx = rnd(20, 80); u.ty = rnd(78, 91); }
        u.walking = true;
      }
    }
    u.x = clamp(u.x, 16, 84);
    u.y = clamp(u.y, 76, 93);

    if (u.bubbleT > 0) {
      u.bubbleT -= dt;
      if (u.bubbleT <= 0) {
        var b = u.el.querySelector('.hm-bubble');
        if (b) b.classList.remove('show');
      }
    } else {
      u.bubble -= dt;
      if (u.bubble <= 0) {
        var line;
        if (u.bladder >= 62 && !furniSpot('u-toilet')) line = one(POTTY_NONE);
        else if (u.bladder >= 62) line = one(POTTY_LINES);
        else if (n.food < 35) line = one(HUNGRY);
        else if (n.clean < 35) line = one(DIRTY);
        else if (n.energy < 30) line = one(TIRED);
        else if (n.mood < 35) line = one(SAD);
        else line = one(LINES[u.id] || PET_LINES);
        say(u, line, 2.8);
        u.bubble = rnd(8, 18);
      }
    }
    draw(u);
  }

  function tick(ts) {
    if (!mounted) return;
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;

    fxTimer -= dt;
    if (fxTimer <= 0) {
      fxTimer = rnd(1.0, 2.4);
      if (Math.random() < 0.7) ambientFx();
    }
    giftTimer -= dt;
    if (giftTimer <= 0) { giftTimer = rnd(24, 45); spawnGift(); }
    decayTimer -= dt;
    if (decayTimer <= 0) {
      decayTimer = 20;
      if (S.decayNeeds()) units.forEach(draw);
    }

    units.forEach(function (u) { step(u, dt); });
    raf = requestAnimationFrame(tick);
  }

  /* ---------------- 家具拖放 ---------------- */

  function renderFurni() {
    if (!furniLayer) return;
    furniLayer.innerHTML = '';
    S.state().room.items.forEach(function (it, i) {
      var g = D.goods(it.id);
      if (!g) return;
      var el = document.createElement('div');
      el.className = 'furni' + (g.flat ? ' flat' : '');
      el.setAttribute('data-fi', String(i));
      el.style.left = it.x + '%';
      el.style.top = it.y + '%';
      el.style.width = (g.w / 800 * 100) + '%';
      el.style.zIndex = String(Math.round(it.y * 10) - 1);
      el.innerHTML = furniSVG(g);
      el.title = g.name + '（按住可以拖动）';
      furniLayer.appendChild(el);
    });
  }

  function bindDrag() {
    var dragging = null, moved = false;
    furniLayer.addEventListener('pointerdown', function (e) {
      var el = e.target.closest ? e.target.closest('.furni') : null;
      if (!el) return;
      dragging = el; moved = false;
      el.classList.add('drag');
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* 老浏览器忽略 */ }
    });
    furniLayer.addEventListener('pointermove', function (e) {
      if (!dragging || !room) return;
      moved = true;
      var r = room.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width * 100;
      var y = (e.clientY - r.top) / r.height * 100;
      dragging.style.left = clamp(x, 6, 94) + '%';
      dragging.style.top = clamp(y, 72, 96) + '%';
    });
    furniLayer.addEventListener('pointerup', function (e) {
      if (!dragging) return;
      var idx = parseInt(dragging.getAttribute('data-fi'), 10);
      dragging.classList.remove('drag');
      if (moved) {
        S.moveFurni(idx, parseFloat(dragging.style.left), parseFloat(dragging.style.top));
        toast('摆放好啦');
      }
      dragging = null;
    });
  }

  /* ---------------- 顶部状态 ---------------- */

  function renderStats() {
    if (!root) return;
    var st = S.state(), el;
    if ((el = root.querySelector('#hStar'))) el.textContent = st.stars;
    if ((el = root.querySelector('#hLevel'))) el.textContent = 'Lv.' + st.level;
    if ((el = root.querySelector('#hXp'))) {
      el.style.width = Math.min(100, st.xp / D.xpForLevel(st.level) * 100).toFixed(1) + '%';
    }
    if ((el = root.querySelector('#hWeather'))) el.textContent = S.weather().icon + ' ' + S.weather().name;
    if ((el = root.querySelector('#hHeart'))) el.textContent = S.heartsTotal();
    if ((el = root.querySelector('#hStreak'))) el.textContent = st.checkin.streak;
  }

  /* ---------------- 工具按钮 ---------------- */

  function doAct(act) {
    if (act === 'snack') {
      dropSnacks(3); sfxDrop();
      if (units[0]) say(units[0], '有吃的！', 2);
    } else if (act === 'potty') {
      /* 让憋着的小马都去一趟厕所 */
      var went = 0;
      units.forEach(function (u) {
        if (u.potty !== 0 || u.sleep > 0 || u.bladder < 35) return;
        if (gotoPotty(u)) went += 1;
      });
      if (!went) toast('现在没有小马想上厕所～');
    } else if (act === 'call') {
      gather(50, 86); sfxCall();
    } else if (act === 'dress') {
      units.forEach(function (u) {
        u.outfit = randomOutfit();
        var inner = u.el.querySelector('.hm-inner');
        if (inner) inner.innerHTML = A.render({ ponyId: u.id, outfit: u.outfit, width: 104 });
        jump(u);
      });
      sfxPet();
    } else if (act === 'sound') {
      var on = S.toggleSound();
      var sb = root.querySelector('[data-hact="sound"]');
      if (sb) sb.textContent = on ? '🔊 音效开' : '🔇 音效关';
      if (on) sfxPet();
    } else if (act === 'day') {
      var day = S.toggleDay();
      room.classList.toggle('night', !day);
      var sky = room.querySelector('.room-art');
      if (sky) sky.outerHTML = roomArt(day);
      var btn = root.querySelector('[data-hact="day"]');
      if (btn) btn.textContent = day ? '🌙 变成晚上' : '☀️ 变成白天';
      sfxDay(day);
      units.forEach(function (u) { say(u, day ? '早上好！' : one(SLEEP_LINES), 2.2); });
    } else if (act === 'photo') {
      var name = prompt('给这张照片起个名字吧', '家园 ' + (S.state().album.length + 1));
      if (typeof name !== 'string') return renderStats();          /* 取消或环境不支持 prompt */
      name = name.trim() || ('家园 ' + (S.state().album.length + 1));
      S.takePhoto(name); sfxCoin(); toast('咔嚓！照片存进相册了');
    } else if (act === 'checkin') {
      var r = S.doCheckin();
      if (r) {
        sfxCoin();
        toast('打卡成功！连续 ' + r.streak + ' 天，星星币 +' + r.reward + '⭐');
        var cb = root.querySelector('[data-hact="checkin"]');
        if (cb && cb.parentNode) cb.parentNode.removeChild(cb);
      }
    } else if (act === 'decor') {
      window.dispatchEvent(new CustomEvent('home:decor'));
    }
    renderStats();
  }

  function gather(x, y) {
    units.forEach(function (u) {
      if (u.sleep > 0) return;
      u.tx = clamp(x + rnd(-11, 11), 18, 84);
      u.ty = clamp(y + rnd(-3, 4), 78, 92);
      u.walking = true; u.wait = 0; u.target = null;
      say(u, '来啦！', 1.6);
    });
  }

  /* ---------------- 装配 ---------------- */

  function bindClicks() {
    root.addEventListener('click', function (e) {
      var t = e.target;
      if (t.closest && t.closest('.pony-menu')) return;
      if (t.closest && t.closest('.gift')) return;

      var hp = t.closest ? t.closest('[data-hp]') : null;
      if (hp) {
        var u = byId(hp.getAttribute('data-hp'));
        if (u) openMenu(u);
        return;
      }
      var act = t.closest ? t.closest('[data-hact]') : null;
      if (act) { doAct(act.getAttribute('data-hact')); return; }
      closeMenu();
      if (!room) return;
      var r = room.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width * 100;
      var y = (e.clientY - r.top) / r.height * 100;
      if (y > 52 && y < 99) gather(x, y);
    });
  }

  function mount(panel) {
    stop();
    var day = S.isDay();
    var list = D.PONIES.filter(function (p) { return S.hasPony(p.id); });
    if (!list.length) list = [D.PONIES[0]];
    var ci = S.checkinState();

    panel.innerHTML = '' +
      '<div class="home" id="homeRoot">' +
      '  <div class="home-bar">' +
      '    <span class="hstat star">⭐ <b id="hStar">0</b></span>' +
      '    <span class="hstat lv"><b id="hLevel">Lv.1</b><i><u id="hXp"></u></i></span>' +
      '    <span class="hstat" id="hWeather">☀️ 晴天</span>' +
      '    <span class="hstat">🔥 连续 <b id="hStreak">0</b> 天</span>' +
      '    <span class="hstat">总爱心 <b id="hHeart">0</b></span>' +
      '    <span class="home-tip">点小马可以摸摸它、喂它、给它洗澡</span>' +
      '  </div>' +
      '  <div class="room' + (day ? '' : ' night') + '" id="room">' +
      roomArt(day) +
      '    <div class="room-layer" id="fxLayer"></div>' +
      '    <div class="room-layer" id="snackLayer"></div>' +
      '    <div class="room-layer furni-layer" id="furniLayer"></div>' +
      '    <div class="room-layer" id="ponyLayer"></div>' +
      '  </div>' +
      '  <div class="home-tools">' +
      '    <button class="btn ghost sm" data-hact="snack" type="button">🍎 撒零食</button>' +
      '    <button class="btn ghost sm" data-hact="potty" type="button">🚽 去上厕所</button>' +
      '    <button class="btn ghost sm" data-hact="call" type="button">🔔 集合啦</button>' +
      '    <button class="btn ghost sm" data-hact="dress" type="button">🎲 换装扮</button>' +
      '    <button class="btn ghost sm" data-hact="day" type="button">' + (day ? '🌙 变成晚上' : '☀️ 变成白天') + '</button>' +
      '    <button class="btn ghost sm" data-hact="photo" type="button">📷 拍张照</button>' +
      '    <button class="btn ghost sm" data-hact="decor" type="button">🎨 换墙纸地板</button>' +
      '    <button class="btn ghost sm" data-hact="sound" type="button">' + (S.soundOn() ? '🔊 音效开' : '🔇 音效关') + '</button>' +
      (ci.done ? '' : '<button class="btn primary sm" data-hact="checkin" type="button">🎁 今日打卡 +' + ci.next + '⭐</button>') +
      '  </div>' +
      '  <div class="home-foot">' +
      '    <span>🏠 小马会饿、会脏、会犯困，好好照顾它们，爱心涨得更快</span>' +
      '    <span>商店里可以买吃的、玩具、家具；家具能直接拖着摆位置</span>' +
      '  </div>' +
      '</div>';

    root = panel.querySelector('#homeRoot');
    room = panel.querySelector('#room');
    ponyLayer = panel.querySelector('#ponyLayer');
    fxLayer = panel.querySelector('#fxLayer');
    snackLayer = panel.querySelector('#snackLayer');
    furniLayer = panel.querySelector('#furniLayer');

    units = list.map(makeUnit);
    units.forEach(function (u) { ponyLayer.appendChild(u.el); draw(u); });
    renderFurni();
    bindDrag();
    renderStats();
    bindClicks();

    mounted = true;
