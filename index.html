<!DOCTYPE html>
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">

        <i>做任务 · 攒饰品 · 打扮自己的小伙伴</i>

      <button class="nav-btn" data-tab="studio" type="button">妆造台</button>

<main class="wrap main">

</footer>

<script src="js/data.js"></script>
