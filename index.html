    last = 0; fxTimer = 1.5; decayTimer = 20; giftTimer = rnd(12, 22);
    raf = requestAnimationFrame(tick);
  }

  function stop() {
    mounted = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    units = []; snacks = [];
    root = room = ponyLayer = fxLayer = snackLayer = furniLayer = null;
  }

  function toast(msg) {
    if (window.App && window.App.toast) return window.App.toast(msg);
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.className = 'toast out'; }, 1600);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  window.Home = { mount: mount, stop: stop, units: function () { return units; } };
})();

</script>
<script>
/* ===== js/shop.js ===== */
/**
 * 星星商店：用星星币买美食、玩具、家具、墙纸和地板
 * 买到的家具会直接出现在家园里（可以拖着摆位置），墙纸地板在这里切换。
 */
(function () {
  'use strict';

  var D = window.DATA, S = window.Store;
  var cat = 'food';

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function effectText(g) {
    if (g.desc) return g.desc;
    if (!g.need) return '';
    var parts = [];
    D.NEEDS.forEach(function (k) {
      if (g.need[k.id] == null) return;
      var v = g.need[k.id];
      parts.push(k.name + (v > 0 ? ' +' : ' ') + v);
    });
    return parts.join(' · ');
  }

  function goodsCard(g) {
    var owned = S.owns(g.id);
    var lvLock = S.level() < g.lv;
    var poor = S.stars() < g.price;
    var using = (g.cat === 'wall' && S.state().room.wall === g.id) ||
                (g.cat === 'floor' && S.state().room.floor === g.id);

    var btn;
    if (using) btn = '<button class="btn ghost xs" disabled type="button">使用中</button>';
    else if (owned) {
      btn = '<button class="btn primary xs" data-apply="' + g.id + '" type="button">换上</button>';
    } else if (lvLock) {
      btn = '<button class="btn ghost xs" disabled type="button">Lv.' + g.lv + ' 解锁</button>';
    } else if (poor) {
      btn = '<button class="btn ghost xs" disabled type="button">⭐不足</button>';
    } else {
      btn = '<button class="btn primary xs" data-buy="' + g.id + '" type="button">买下</button>';
    }

    return '<div class="goods' + (owned ? ' owned' : '') + (lvLock ? ' lock' : '') + '">' +
      '<span class="g-icon"' + (g.swatch ? ' style="background:' + g.swatch + '"' : '') + '>' +
      (g.swatch ? '' : g.icon) + '</span>' +
      '<span class="g-name">' + esc(g.name) + (owned ? '<i class="have">已有</i>' : '') + '</span>' +
      '<span class="g-eff">' + esc(effectText(g) || (g.cat === 'furni' ? '摆进家园的小家具' : '可以换上的新样式')) + '</span>' +
      '<span class="g-foot"><b class="price">⭐ ' + g.price + '</b>' + btn + '</span>' +
      '</div>';
  }

  function bagHTML() {
    var bag = S.bagList().filter(function (b) { return b.goods.cat === 'food' || b.goods.cat === 'toy'; });
    if (!bag.length) return '<p class="muted">背包还是空的，先去上面买点吃的吧～</p>';
    return '<div class="bag-row">' + bag.map(function (b) {
      return '<span class="bag-item">' + b.goods.icon + ' ' + esc(b.goods.name) + '<b>×' + b.count + '</b></span>';
    }).join('') + '</div>';
  }

  function roomHTML() {
    var st = S.state();
    var walls = D.goodsBy('wall').filter(function (g) { return S.owns(g.id); });
    var floors = D.goodsBy('floor').filter(function (g) { return S.owns(g.id); });
    var furnis = S.bagList().filter(function (b) { return b.goods.cat === 'furni'; });
    return '<div class="decor-box">' +
      '<div class="decor-line"><span>墙纸</span>' + walls.map(function (g) {
        return '<button class="swatch' + (st.room.wall === g.id ? ' on' : '') + '" data-apply="' + g.id +
          '" style="background:' + g.swatch + '" title="' + esc(g.name) + '" type="button"></button>';
      }).join('') + '</div>' +
      '<div class="decor-line"><span>地板</span>' + floors.map(function (g) {
        return '<button class="swatch' + (st.room.floor === g.id ? ' on' : '') + '" data-apply="' + g.id +
          '" style="background:' + g.swatch + '" title="' + esc(g.name) + '" type="button"></button>';
      }).join('') + '</div>' +
      '<div class="decor-line"><span>家具</span>' + (furnis.length ? furnis.map(function (b) {
        return '<span class="bag-item">' + b.goods.icon + ' ' + esc(b.goods.name) + '</span>';
      }).join('') : '<span class="muted">还没有家具，买一件摆进房间吧</span>') + '</div>' +
      '</div>';
  }

  function render(panel) {
    var st = S.state();
    var cats = ['food', 'toy', 'furni', 'wall', 'floor'];
    panel.innerHTML = '' +
      '<div class="shop">' +
      '  <div class="shop-head">' +
      '    <div>' +
      '      <h3 class="sec-title">星星商店</h3>' +
      '      <p class="muted">做任务、打卡、照顾小马都能赚星星币，攒够了就来这里买买买。</p>' +
      '    </div>' +
      '    <div class="shop-wallet">' +
      '      <span class="wallet">⭐ <b>' + st.stars + '</b></span>' +
      '      <span class="wallet lv">Lv.' + st.level + '</span>' +
      '      <span class="wallet">🔥 连续 ' + st.checkin.streak + ' 天</span>' +
      '    </div>' +
      '  </div>' +
      '  <div class="cat-tabs">' + cats.map(function (c) {
        return '<button class="cat' + (cat === c ? ' on' : '') + '" data-scat="' + c + '" type="button">' +
          D.CAT_NAMES[c] + '</button>';
      }).join('') + '</div>' +
      '  <div class="goods-grid">' + D.goodsBy(cat).map(goodsCard).join('') + '</div>' +
      '  <h3 class="sec-title">我的背包</h3>' + bagHTML() +
      '  <h3 class="sec-title">房间装扮</h3>' + roomHTML() +
      '  <p class="muted sm">买到的家具会自动摆进家园，进家园后按住家具就能拖到喜欢的位置。</p>' +
      '</div>';
  }

  function bind(panel) {
    panel.addEventListener('click', function (e) {
      var t = e.target;
      var c = t.closest ? t.closest('[data-scat]') : null;
      if (c) { cat = c.getAttribute('data-scat'); render(panel); return; }

      var b = t.closest ? t.closest('[data-buy]') : null;
      if (b) {
        var r = S.buy(b.getAttribute('data-buy'));
        if (window.App && window.App.toast) window.App.toast(r.msg);
        render(panel);
        return;
      }
      var a = t.closest ? t.closest('[data-apply]') : null;
      if (a) {
        var id = a.getAttribute('data-apply');
        var g = D.goods(id);
        if (g && g.cat === 'wall') S.setWall(id);
        else if (g && g.cat === 'floor') S.setFloor(id);
        if (window.App && window.App.toast) window.App.toast('已经换上「' + g.name + '」啦');
        render(panel);
      }
    });
  }

  function mount(panel) {
    render(panel);
    if (!panel.__shopBound) {
      bind(panel);
      panel.__shopBound = true;
    }
  }

  window.Shop = {
    mount: mount,
    focus: function (c) { cat = c || 'food'; }
  };
})();

</script>
<script>
/* ===== js/games.js ===== */
/**
 * 小游戏：抓星星（练反应）和记忆翻牌（练记性）
 * 玩完按成绩给星星币，成绩会记进存档。
 */
(function () {
  'use strict';

  var D = window.DATA, S = window.Store, A = window.Avatar;
  var view = 'menu';
  var timers = [];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function toast(m) { if (window.App && window.App.toast) window.App.toast(m); }
  function clearTimers() {
    timers.forEach(function (t) { clearInterval(t); clearTimeout(t); });
    timers = [];
  }
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function every(fn, ms) { var t = setInterval(fn, ms); timers.push(t); return t; }

  /* ---------------- 菜单 ---------------- */

  function menuHTML() {
    var best = S.state().gameBest;
    return '' +
      '<div class="games">' +
      '  <div class="games-head">' +
      '    <h3 class="sec-title">小游戏</h3>' +
      '    <p class="muted">玩一局换点星星币，累了就回来照顾小马～</p>' +
      '  </div>' +
      '  <div class="game-pick">' +
      '    <button class="gp" data-game="star" type="button">' +
      '      <span class="gp-icon">⭐</span>' +
      '      <b>抓星星</b>' +
      '      <i>30 秒内点掉落的星星，金色星星值 3 分</i>' +
      '      <em>最好成绩 ' + (best.star || 0) + ' 分</em>' +
      '    </button>' +
      '    <button class="gp" data-game="memory" type="button">' +
      '      <span class="gp-icon">🃏</span>' +
      '      <b>记忆翻牌</b>' +
      '      <i>翻开两两相同的小马，步数越少奖励越多</i>' +
      '      <em>最少步数 ' + (best.memory || '—') + '</em>' +
      '    </button>' +
      '  </div>' +
      '</div>';
  }

  /* ---------------- 抓星星 ---------------- */

  function startStar(panel) {
    var score = 0, left = 30;
    panel.innerHTML = '' +
      '<div class="game-wrap">' +
      '  <div class="game-bar">' +
      '    <button class="btn ghost sm" data-quit type="button">← 返回</button>' +
      '    <span class="gscore">得分 <b id="gScore">0</b></span>' +
      '    <span class="gtime">剩余 <b id="gTime">30</b> 秒</span>' +
      '  </div>' +
      '  <div class="star-field" id="field"><span class="game-tip">准备…点星星！</span></div>' +
      '</div>';

    var field = panel.querySelector('#field');
    var sEl = panel.querySelector('#gScore');
    var tEl = panel.querySelector('#gTime');

    function spawn() {
      if (!field.isConnected) return;
      var gold = Math.random() < 0.22;
      var s = document.createElement('span');
      s.className = 'fall-star' + (gold ? ' gold' : '');
      s.textContent = gold ? '🌟' : '⭐';
      s.style.left = (6 + Math.random() * 84).toFixed(1) + '%';
      var dur = (gold ? 2.1 : 2.8) + Math.random() * 0.9;
      s.style.animationDuration = dur.toFixed(2) + 's';
      s.addEventListener('pointerdown', function () {
        score += gold ? 3 : 1;
        sEl.textContent = score;
        var pop = document.createElement('span');
        pop.className = 'star-pop';
        pop.textContent = '+' + (gold ? 3 : 1);
        pop.style.left = s.style.left;
        pop.style.top = (parseFloat(s.style.top) || 40) + '%';
        field.appendChild(pop);
        later(function () { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 700);
        if (s.parentNode) s.parentNode.removeChild(s);
      });
      field.appendChild(s);
      later(function () { if (s.parentNode) s.parentNode.removeChild(s); }, dur * 1000);
    }

    later(function () {
      var tip = field.querySelector('.game-tip');
      if (tip && tip.parentNode) tip.parentNode.removeChild(tip);
      every(spawn, 420);
      every(function () {
        left -= 1;
        tEl.textContent = left;
        if (left <= 0) {
          clearTimers();
          var gain = Math.round(score / 3) + 2;
          S.setGameBest('star', score);
          panel.innerHTML = '' +
            '<div class="game-over">' +
            '  <h3>时间到！</h3>' +
            '  <p class="big-score">' + score + ' 分</p>' +
            '  <p class="muted">抓到 ' + score + ' 分，换成 <b>⭐ ' + gain + '</b> 星星币</p>' +
            '  <div class="row">' +
            '    <button class="btn primary" data-again="star" type="button">再来一局</button>' +
            '    <button class="btn ghost" data-quit type="button">返回</button>' +
            '  </div>' +
            '</div>';
        }
      }, 1000);
    }, 700);
  }

  /* ---------------- 记忆翻牌 ---------------- */

  var mem = null;   /* 翻牌状态放在模块级，事件走统一委托 */

  function startMemory(panel) {
    var pool = D.PONIES.slice(0, 6);
    var cards = [];
    pool.forEach(function (p) { cards.push(p.id); cards.push(p.id); });
    for (var i = cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = cards[i]; cards[i] = cards[j]; cards[j] = t;
    }
    mem = { cards: cards, open: [], done: [], steps: 0, lock: false };
    renderMem(panel);
  }

  function renderMem(panel) {
    panel.innerHTML = '' +
      '<div class="game-wrap">' +
      '  <div class="game-bar">' +
      '    <button class="btn ghost sm" data-quit type="button">← 返回</button>' +
      '    <span class="gscore">步数 <b id="mSteps">' + mem.steps + '</b></span>' +
      '    <span class="gtime">配对 <b id="mDone">' + (mem.done.length / 2) + '</b> / 6</span>' +
      '  </div>' +
      '  <div class="mem-grid">' + mem.cards.map(function (id, k) {
        var shown = mem.open.indexOf(k) >= 0 || mem.done.indexOf(k) >= 0;
        var p = D.pony(id);
        return '<button class="mem-card' + (shown ? ' open' : '') + (mem.done.indexOf(k) >= 0 ? ' done' : '') +
          '" data-card="' + k + '" type="button">' +
          (shown ? '<span class="mc-art">' + A.render({ ponyId: id, outfit: {}, width: 76 }) + '</span>' +
            '<span class="mc-name">' + esc(p.name) + '</span>' : '<span class="mc-back">?</span>') +
          '</button>';
      }).join('') + '</div>' +
      '  <p class="muted sm">翻开两张一样的小马就能配对，全配完就通关啦。</p>' +
      '</div>';
  }

  function flipCard(panel, k) {
    if (!mem || mem.lock) return;
    if (mem.open.indexOf(k) >= 0 || mem.done.indexOf(k) >= 0) return;
    mem.open.push(k);
    renderMem(panel);
    if (mem.open.length < 2) return;

    mem.steps += 1;
    var sEl = panel.querySelector('#mSteps');
    if (sEl) sEl.textContent = mem.steps;

    if (mem.cards[mem.open[0]] === mem.cards[mem.open[1]]) {
      mem.done = mem.done.concat(mem.open);
      mem.open = [];
      renderMem(panel);
      if (mem.done.length === mem.cards.length) {
        clearTimers();
        var steps = mem.steps;
        var gain = Math.max(5, 24 - steps);
        S.setGameBest('memory', steps);
        mem = null;
        panel.innerHTML = '' +
          '<div class="game-over">' +
          '  <h3>全部配对成功！</h3>' +
          '  <p class="big-score">' + steps + ' 步</p>' +
          '  <p class="muted">用了 ' + steps + ' 步，获得 <b>⭐ ' + gain + '</b> 星星币（步数越少越多）</p>' +
          '  <div class="row">' +
          '    <button class="btn primary" data-again="memory" type="button">再来一局</button>' +
          '    <button class="btn ghost" data-quit type="button">返回</button>' +
          '  </div>' +
          '</div>';
      }
    } else {
      mem.lock = true;
      later(function () {
        if (!mem) return;
        mem.open = []; mem.lock = false;
        renderMem(panel);
      }, 900);
    }
  }

  /* ---------------- 装配 ---------------- */

  function mount(panel) {
    clearTimers();
    if (view === 'star') { startStar(panel); return; }
    if (view === 'memory') { startMemory(panel); return; }
    panel.innerHTML = menuHTML();
  }

  function bind(panel) {
    panel.addEventListener('click', function (e) {
      var t = e.target;
      var c = t.closest ? t.closest('[data-card]') : null;
      if (c) { flipCard(panel, parseInt(c.getAttribute('data-card'), 10)); return; }
      var g = t.closest ? t.closest('[data-game]') : null;
      if (g) { view = g.getAttribute('data-game'); mount(panel); return; }
      var ag = t.closest ? t.closest('[data-again]') : null;
      if (ag) { view = ag.getAttribute('data-again'); mount(panel); return; }
      var q = t.closest ? t.closest('[data-quit]') : null;
      if (q) { view = 'menu'; clearTimers(); mount(panel); }
    });
  }

  window.Games = {
    mount: function (panel) {
      if (!panel.__gamesBound) { bind(panel); panel.__gamesBound = true; }
      mount(panel);
    },
    stop: function () { clearTimers(); view = 'menu'; mem = null; }
  };
})();

</script>
<script>
/* ===== js/app.js ===== */
/**
 * 玩家端逻辑：妆造台 / 任务中心 / 收集图鉴
 */
(function () {
  'use strict';

  var D = window.DATA, S = window.Store, A = window.Avatar;
  var tab = 'studio';
  var catFilter = 'all';
  var taskFilter = 'all';
  var focusTask = null;

  var STATUS_TEXT = { todo: '未开始', pending: '待家长审核', approved: '已完成', rejected: '被打回' };

  function el(sel) { return document.querySelector(sel); }
  function pick(obj, keys) {
    var o = {}, k;
    for (k in obj) if (obj.hasOwnProperty(k) && keys.indexOf(k) >= 0) o[k] = obj[k];
    return o;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 弹层 ---------- */

  var modal = null;
  function openModal(html) {
    closeModal();
    modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = '<div class="modal-card">' + html + '</div>';
    modal.addEventListener('click', function (e) {
      if (e.target === modal || e.target.hasAttribute('data-close')) closeModal();
    });
    document.body.appendChild(modal);
    return modal;
  }
  function closeModal() {
    if (modal && modal.parentNode) modal.parentNode.removeChild(modal);
    modal = null;
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.className = 'toast out'; }, 1600);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  /* ---------- 片段 ---------- */

  function previewHTML(item) {
    var st = S.state();
    var o = pick(st.outfit, ['wing', 'hair', 'forehead', 'headwear', 'glasses', 'eyes', 'cheek', 'neck']);
    o[item.slot] = item.id;
    return A.render({ ponyId: st.activePony, outfit: o, width: 116 });
  }

  function ponyChipHTML(p, active, unlocked, size) {
    var o = unlocked
      ? pick(S.state().outfit, ['wing', 'hair', 'forehead', 'headwear', 'glasses', 'eyes', 'cheek', 'neck'])
      : {};
    return '<button class="pony-chip' + (active ? ' on' : '') + (unlocked ? '' : ' locked') +
      '" data-pony="' + p.id + '" type="button">' +
      '<span class="pony-chip-art">' + (unlocked
        ? A.render({ ponyId: p.id, outfit: o, width: size || 88 })
        : '<span class="lock-q">?</span>') + '</span>' +
      '<span class="pony-chip-name">' + p.name + '</span>' +
      '<span class="pony-chip-race">' + p.race + '</span>' +
      '</button>';
  }

  function rewardNames(t) {
    return (t.rewards || []).map(function (r) {
      if (r.indexOf('pony:') === 0) {
        var p = D.pony(r.slice(5));
        return p ? '小马 ' + p.name : r;
      }
      var i = D.item(r);
      return i ? i.name : r;
    });
  }

  /* ---------- 妆造台 ---------- */

  function renderStudio() {
    var st = S.state();
    var p = D.pony(st.activePony);

    el('#panel').innerHTML = '' +
      '<div class="studio">' +
      '  <div class="stage">' +
      '    <div class="stage-card ' + (st.outfit.bg || '') + '">' +
      A.render({ ponyId: st.activePony, outfit: st.outfit, width: 320 }) +
      '      <div class="stage-name">' + p.name + '<span>' + p.race + '</span></div>' +
      '      <div class="stage-desc">' + p.desc + '</div>' +
      '    </div>' +
      '    <div class="stage-actions">' +
      '      <button class="btn ghost" data-act="random">随机搭配</button>' +
      '      <button class="btn ghost" data-act="clear">全部脱下</button>' +
      '      <button class="btn ghost" data-act="save-look">保存造型</button>' +
      '      <button class="btn ghost" data-act="download">下载形象</button>' +
      '    </div>' +
      '    <div class="looks">' + (st.looks.length
        ? st.looks.map(function (l, i) {
            return '<span class="look-chip"><button class="look-load" data-look="' + i + '" type="button">' + esc(l.name) + '</button>' +
              '<button class="look-del" data-lookdel="' + i + '" type="button" title="删除">×</button></span>';
          }).join('')
        : '<span class="muted">还没有保存的造型</span>') +
      '    </div>' +
      '  </div>' +

      '  <div class="wardrobe">' +
      '    <h3 class="sec-title">选择小伙伴</h3>' +
      '    <div class="pony-list">' + D.PONIES.map(function (pp) {
            return ponyChipHTML(pp, pp.id === st.activePony, S.hasPony(pp.id), 84);
          }).join('') + '</div>' +
      '    <h3 class="sec-title">装扮衣柜</h3>' +
      '    <div class="cat-tabs">' +
      '      <button class="cat' + (catFilter === 'all' ? ' on' : '') + '" data-cat="all" type="button">全部</button>' +
      D.CATS.map(function (c) {
        return '<button class="cat' + (catFilter === c.id ? ' on' : '') + '" data-cat="' + c.id + '" type="button">' + c.name + '</button>';
      }).join('') +
      '    </div>' +
      '    <div class="item-tip" id="itemTip"></div>' +
      '    <div class="item-grid">' + itemCells() + '</div>' +
      '  </div>' +
      '</div>';
  }

  function itemCells() {
    var st = S.state();
    if (catFilter === 'all') {
      return D.CATS.map(function (c) {
        return '<div class="item-group"><h4>' + c.name + '</h4><div class="item-row">' +
          groupCells(c.id) + '</div></div>';
      }).join('');
    }
    return '<div class="item-row">' + groupCells(catFilter) + '</div>';
  }

  function groupCells(slot) {
    var st = S.state();
    if (slot === 'bg') return D.bySlot('bg').map(bgCellHTML).join('');
    return D.bySlot(slot).map(function (it) {
      var owned = S.hasItem(it.id);
      var on = st.outfit[it.slot] === it.id;
      return '<button class="item-cell' + (owned ? '' : ' locked') + (on ? ' on' : '') +
        '" data-item="' + it.id + '" type="button">' +
        '<span class="cell-art">' + (owned ? previewHTML(it) : '<span class="lock-q">?</span>') + '</span>' +
        '<span class="cell-name">' + it.name + '</span>' +
        (owned ? '' : '<span class="cell-lock">未解锁</span>') +
        '</button>';
    }).join('');
  }

  function bgCellHTML(it) {
    var st = S.state();
    var owned = S.hasItem(it.id);
    var on = st.outfit.bg === it.id;
    return '<button class="item-cell bg-cell' + (owned ? '' : ' locked') + (on ? ' on' : '') +
      '" data-item="' + it.id + '" type="button">' +
      '<span class="cell-bg ' + it.id + '"></span>' +
      '<span class="cell-name">' + it.name + '</span>' +
      (owned ? '' : '<span class="cell-lock">未解锁</span>') +
      '</button>';
  }

  /* ---------- 任务中心 ---------- */

  function renderTasks() {
    var list = S.allTasks().filter(function (t) {
      var s = S.taskStatus(t.id);
      if (taskFilter === 'all') return true;
      if (taskFilter === 'doing') return s === 'todo' || s === 'rejected';
      return s === taskFilter;
    });

    var st = S.state();
    el('#panel').innerHTML = '' +
      '<div class="tasks">' +
      '  <div class="task-head">' +
      '    <div>' +
      '      <h3 class="sec-title">任务清单</h3>' +
      '      <p class="muted">完成任务后点「我完成啦」，家长审核通过就能领奖励。</p>' +
      '    </div>' +
      '    <div class="chips">' +
      ['all:全部', 'doing:待完成', 'pending:待审核', 'approved:已完成'].map(function (x) {
        var k = x.split(':')[0], n = x.split(':')[1];
        return '<button class="chip' + (taskFilter === k ? ' on' : '') + '" data-tfilter="' + k + '" type="button">' + n + '</button>';
      }).join('') +
      '    </div>' +
      '  </div>' +
      '  <div class="task-list">' + (list.length ? list.map(taskCardHTML).join('') :
        '<div class="empty">这里暂时没有任务～</div>') + '</div>' +
      '</div>';

    if (focusTask) {
      var node = el('[data-task="' + focusTask + '"]');
      if (node) {
        node.classList.add('focus');
        node.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      setTimeout(function () { focusTask = null; }, 50);
    }
  }

  function taskCardHTML(t) {
    var status = S.taskStatus(t.id);
    var rec = S.state().tasks[t.id] || {};
    var rw = rewardNames(t).map(function (n) { return '<span class="rw">' + esc(n) + '</span>'; }).join('');
    var foot = '';
    if (status === 'todo') {
      foot = '<button class="btn primary sm" data-submit="' + t.id + '" type="button">我完成啦</button>';
    } else if (status === 'pending') {
      foot = '<button class="btn ghost sm" data-cancel="' + t.id + '" type="button">撤回一下</button>';
    } else if (status === 'rejected') {
      foot = '<button class="btn primary sm" data-submit="' + t.id + '" type="button">再做一次</button>';
    } else {
      foot = '<span class="ok">奖励已到手</span>';
    }
    return '<div class="task-card ' + status + (focusTask === t.id ? ' focus' : '') + '" data-task="' + t.id + '">' +
      '<div class="task-top">' +
      '  <span class="tag">' + esc(t.tag || '任务') + '</span>' +
      '  <span class="badge ' + status + '">' + STATUS_TEXT[status] + '</span>' +
      '</div>' +
      '<h4 class="task-title">' + esc(t.title) + '</h4>' +
      '<p class="task-desc">' + esc(t.desc) + '</p>' +
      (rec.note ? '<p class="task-note">我的留言：' + esc(rec.note) + '</p>' : '') +
      (rec.reason ? '<p class="task-reason">家长说：' + esc(rec.reason) + '</p>' : '') +
      '<div class="task-rewards">' + rw + '</div>' +
      '<div class="task-foot">' + foot + '</div>' +
      '</div>';
  }

  /* ---------- 成就 ---------- */

  function timeText(ts) {
    var d = new Date(ts);
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderAch() {
    var st = S.state();
    var got = D.ACHIEVEMENTS.filter(function (a) { return S.hasAch(a.id); }).length;
    el('#panel').innerHTML = '' +
      '<div class="ach">' +
      '  <div class="adm-head"><h2 class="sec-title">我的成就 <em>' + got + ' / ' + D.ACHIEVEMENTS.length + '</em></h2>' +
      '    <p class="muted">达成成就就能领一大笔星星币，看看还差哪些～</p></div>' +
      '  <div class="ach-grid">' + D.ACHIEVEMENTS.map(function (a) {
        var has = S.hasAch(a.id);
        return '<div class="ach-card' + (has ? ' got' : '') + '">' +
          '<span class="ach-medal">' + (has ? '🏅' : '🔒') + '</span>' +
          '<b>' + esc(a.name) + '</b>' +
          '<i>' + esc(a.desc) + '</i>' +
          '<span class="ach-star">⭐ ' + a.stars + '</span>' +
          (has ? '<span class="ach-time">' + timeText(st.achievements[a.id]) + '</span>' : '') +
          '</div>';
      }).join('') + '</div>' +
      '</div>';
  }

  /* ---------- 相册 ---------- */

  function renderAlbum() {
    var st = S.state();
    el('#panel').innerHTML = '' +
      '<div class="album">' +
      '  <div class="adm-head"><h2 class="sec-title">家园相册 <em>' + st.album.length + ' / 12</em></h2>' +
      '    <p class="muted">在家园里点「📷 拍张照」就能把当时的样子存下来。</p></div>' +
      (st.album.length ? '<div class="album-grid">' + st.album.map(function (p, i) {
        var wall = D.goods(p.wall), floor = D.goods(p.floor);
        var w = D.weather(p.weather);
        return '<div class="photo">' +
          '<div class="ph-view" style="background:' + ((wall && wall.swatch) || '#ffd9ec') + '">' +
          '  <span class="ph-floor" style="background:' + ((floor && floor.swatch) || '#f3e6f7') + '"></span>' +
          '  <span class="ph-sky">' + (p.day ? '☀️' : '🌙') + ' ' + w.icon + '</span>' +
          '  <span class="ph-ponies">' + p.ponies.slice(0, 4).map(function (x) {
            var pp = D.pony(x.id);
            return pp ? A.render({ ponyId: x.id, outfit: {}, width: 46 }) : '';
          }).join('') + '</span>' +
          '</div>' +
          '<div class="ph-info"><b>' + esc(p.name) + '</b><i>' + timeText(p.at) + '</i>' +
          '<button class="btn danger xs" data-phdel="' + i + '" type="button">删除</button></div>' +
          '</div>';
      }).join('') + '</div>' : '<div class="empty">还没有照片，去家园拍一张吧～</div>') +
      '</div>';
  }

  /* ---------- 图鉴 ---------- */

  function renderGallery() {
    var st = S.state();
    var s = S.stats();
    el('#panel').innerHTML = '' +
      '<div class="gallery">' +
      '  <div class="progress-box">' +
      '    <div class="pg"><span>饰品收集</span><b>' + s.items + ' / ' + s.itemsTotal + '</b></div>' +
      '    <div class="bar"><i style="width:' + (s.items / s.itemsTotal * 100).toFixed(1) + '%"></i></div>' +
      '    <div class="pg"><span>小马伙伴</span><b>' + s.ponies + ' / ' + s.poniesTotal + '</b></div>' +
      '    <div class="bar"><i style="width:' + (s.ponies / s.poniesTotal * 100).toFixed(1) + '%"></i></div>' +
      '    <div class="pg"><span>任务完成</span><b>' + s.approved + ' / ' + s.total + '</b></div>' +
      '    <div class="bar"><i style="width:' + (s.approved / Math.max(1, s.total) * 100).toFixed(1) + '%"></i></div>' +
      '  </div>' +
      '  <h3 class="sec-title">小马伙伴</h3>' +
      '  <div class="pony-list big">' + D.PONIES.map(function (p) {
          return ponyChipHTML(p, false, S.hasPony(p.id), 108);
        }).join('') + '</div>' +
      D.CATS.map(function (c) {
        return '<h3 class="sec-title">' + c.name + '<em>' +
          D.bySlot(c.id).filter(function (i) { return S.hasItem(i.id); }).length + '/' + D.bySlot(c.id).length +
          '</em></h3><div class="mini-grid">' + D.bySlot(c.id).map(miniCell).join('') + '</div>';
      }).join('') +
      '</div>';
  }

  function miniCell(it) {
    var owned = S.hasItem(it.id);
    if (it.slot === 'bg') {
      return '<div class="mini ' + (owned ? '' : 'locked') + '"><span class="cell-bg ' + it.id + '"></span>' +
        '<span>' + it.name + '</span></div>';
    }
    return '<div class="mini ' + (owned ? '' : 'locked') + '">' +
      (owned ? '<span class="mini-art">' + previewHTML(it) + '</span>' : '<span class="lock-q">?</span>') +
      '<span>' + it.name + '</span></div>';
  }

  /* ---------- 交互 ---------- */

  function equip(it) {
    var st = S.state();
    if (!S.hasItem(it.id)) return openLockedModal(it);
    if (it.slot === 'bg') {
      st.outfit.bg = it.id;
    } else {
      st.outfit[it.slot] = st.outfit[it.slot] === it.id ? null : it.id;
    }
    S.save();
    render();
  }

  function openLockedModal(it) {
    var t = D.taskOf(it.id) || D.taskOf('pony:' + it.id);
    var body;
    if (t) {
      body = '<h3>还差一步就能拿到啦</h3>' +
        '<div class="lock-task">' +
        '  <span class="tag">' + esc(t.tag || '任务') + '</span>' +
        '  <h4>' + esc(t.title) + '</h4>' +
        '  <p>' + esc(t.desc) + '</p>' +
        '  <div class="task-rewards">' + rewardNames(t).map(function (n) { return '<span class="rw">' + esc(n) + '</span>'; }).join('') + '</div>' +
        '</div>' +
        '<p class="muted sm">完成后点「我完成啦」，等爸爸妈妈审核通过就会自动解锁。</p>' +
        '<div class="modal-actions">' +
        '  <button class="btn ghost" data-close type="button">知道啦</button>' +
        '  <button class="btn primary" data-gotask="' + t.id + '" type="button">去做这个任务</button>' +
        '</div>';
    } else {
      body = '<h3>这件还没有解锁</h3><p class="muted">请爸爸妈妈在管理端帮你解锁。</p>' +
        '<div class="modal-actions"><button class="btn primary" data-close type="button">好的</button></div>';
    }
    openModal(body);
  }

  function renderCheatBtn() {
    var b = el('#cheatBtn');
    if (!b) return;
    var on = S.cheatOn();
    b.classList.toggle('on', on);
    b.textContent = on ? '🔓 破解中' : '🔒 破解开关';
    b.title = on ? '点击关闭破解，恢复到开启前的解锁状态' : '点击解锁全部小马和饰品';
  }

  function toggleCheat() {
    var on = !S.cheatOn();
    if (!on && !confirm('关闭破解后，会收回靠破解解锁的内容，恢复到开启破解前的状态。确定吗？')) return;
    S.setCheat(on);
    toast(on ? '破解已开启：全部小马和饰品已解锁' : '破解已关闭，已恢复原状');
    render();
  }

  function askSubmit(t) {
    openModal('<h3>' + esc(t.title) + '</h3>' +
      '<p class="muted">完成了就和爸爸妈妈说一声，写点什么让他们放心吧。</p>' +
      '<textarea id="noteBox" class="ta" rows="3" placeholder="例如：今天我把《小马过河》读完了，还讲了结局给妈妈听。"></textarea>' +
      '<div class="modal-actions">' +
      '  <button class="btn ghost" data-close type="button">再等等</button>' +
      '  <button class="btn primary" data-dosubmit="' + t.id + '" type="button">提交给家长审核</button>' +
      '</div>');
  }

  function randomize() {
    var st = S.state();
    D.CATS.forEach(function (c) {
      if (c.id === 'bg') return;
      var pool = D.bySlot(c.id).filter(function (i) { return S.hasItem(i.id); });
      st.outfit[c.id] = pool.length && Math.random() < 0.65
        ? pool[Math.floor(Math.random() * pool.length)].id : null;
    });
    var bgs = D.bySlot('bg').filter(function (i) { return S.hasItem(i.id); });
    st.outfit.bg = bgs.length ? bgs[Math.floor(Math.random() * bgs.length)].id : st.outfit.bg;
    S.save();
    render();
    toast('换了一套新造型');
  }

  function downloadSVG() {
    var st = S.state();
    var svg = A.render({ ponyId: st.activePony, outfit: st.outfit, width: 520 })
      .replace('<g>', '<g>').replace('<g>', '<g>');
    var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pony-' + st.activePony + '.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('已保存到下载文件夹');
  }

  /* ---------- 事件 ---------- */

  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target;
      var hit = function (sel) {
        var n = t.closest ? t.closest(sel) : null;
        return n;
      };
      var n;

      if ((n = hit('[data-cheat]')) && n.closest('#playerView')) { toggleCheat(); return; }
      if ((n = hit('[data-tab]'))) { tab = n.getAttribute('data-tab'); render(); return; }
      if ((n = hit('[data-cat]'))) { catFilter = n.getAttribute('data-cat'); render(); return; }
      if ((n = hit('[data-tfilter]'))) { taskFilter = n.getAttribute('data-tfilter'); render(); return; }
      if ((n = hit('[data-close]'))) { closeModal(); return; }

      if ((n = hit('[data-pony]'))) {
        var pid = n.getAttribute('data-pony');
        if (!S.hasPony(pid)) {
          var p = D.pony(pid);
          var tk = D.taskOf('pony:' + pid);
          openModal('<h3>' + p.name + '还没有来到小马谷</h3>' +
            '<p class="muted">' + esc(p.desc) + '</p>' +
            (tk ? '<p>完成这个任务就能请它回家：<b>' + esc(tk.title) + '</b></p>' +
                  '<div class="modal-actions"><button class="btn ghost" data-close type="button">知道啦</button>' +
                  '<button class="btn primary" data-gotask="' + tk.id + '" type="button">去看看任务</button></div>'
                : '<div class="modal-actions"><button class="btn primary" data-close type="button">好的</button></div>'));
          return;
        }
        S.state().activePony = pid;
        S.save();
        render();
        return;
      }

      if ((n = hit('[data-item]'))) {
        var it = D.item(n.getAttribute('data-item'));
        if (it) equip(it);
        return;
      }

      if ((n = hit('[data-submit]'))) {
        var tk2 = S.findTask(n.getAttribute('data-submit'));
        if (tk2) askSubmit(tk2);
        return;
      }
      if ((n = hit('[data-dosubmit]'))) {
        var id = n.getAttribute('data-dosubmit');
        var box = el('#noteBox');
        S.submitTask(id, box ? box.value.trim() : '');
        closeModal();
        toast('已提交，等爸爸妈妈审核');
        render();
        return;
      }
      if ((n = hit('[data-cancel]'))) {
        S.cancelSubmit(n.getAttribute('data-cancel'));
        toast('已撤回');
        render();
        return;
      }
      if ((n = hit('[data-gotask]'))) {
        focusTask = n.getAttribute('data-gotask');
        closeModal();
        tab = 'tasks';
        taskFilter = 'all';
        render();
        return;
      }
      if ((n = hit('[data-act]'))) {
        var act = n.getAttribute('data-act');
        if (act === 'random') return randomize();
        if (act === 'clear') {
          D.CATS.forEach(function (c) { if (c.id !== 'bg') S.state().outfit[c.id] = null; });
          S.save(); render(); return;
        }
        if (act === 'save-look') {
          var name = prompt('给这套造型起个名字吧', '造型 ' + (S.state().looks.length + 1));
          if (name) { S.saveLook(name.trim()); render(); toast('造型已保存'); }
          return;
        }
        if (act === 'download') return downloadSVG();
      }
      if ((n = hit('[data-look]'))) {
        S.loadLook(parseInt(n.getAttribute('data-look'), 10));
        toast('造型已切换');
        render();
        return;
      }
      if ((n = hit('[data-lookdel]'))) {
        S.removeLook(parseInt(n.getAttribute('data-lookdel'), 10));
        render();
        return;
      }
      if ((n = hit('[data-docheckin]'))) {
        var r = S.doCheckin();
        closeModal();
        if (r) toast('打卡成功！连续 ' + r.streak + ' 天，⭐ +' + r.reward);
        render();
        return;
      }
      if ((n = hit('[data-phdel]'))) {
        S.removePhoto(parseInt(n.getAttribute('data-phdel'), 10));
        render();
        return;
      }
      if ((n = hit('[data-reload]'))) { render(); return; }
    });
  }

  /* ---------- 主渲染 ---------- */

  function renderNav() {
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === tab);
    });
  }

  function checkPendingAch() {
    var list = S.takePendingAch();
    list.forEach(function (a, i) {
      setTimeout(function () { toast('🏅 成就达成 · ' + a.name + '　+' + a.stars + '⭐'); }, i * 700);
    });
  }

  function render() {
    renderNav();
    renderCheatBtn();
    if (window.Home) window.Home.stop();
    if (window.Games && tab !== 'games') window.Games.stop();
    if (tab === 'studio') renderStudio();
    else if (tab === 'tasks') renderTasks();
    else if (tab === 'home') window.Home.mount(el('#panel'));
    else if (tab === 'shop') window.Shop.mount(el('#panel'));
    else if (tab === 'games') window.Games.mount(el('#panel'));
    else if (tab === 'ach') renderAch();
    else if (tab === 'album') renderAlbum();
    else renderGallery();
    var st = S.state();
    var badge = el('#pendingBadge');
    if (badge) {
      var n = S.stats().pending;
      badge.textContent = n ? String(n) : '';
      badge.style.display = n ? '' : 'none';
    }
    var nameNode = el('#playerName');
    if (nameNode) nameNode.textContent = st.player;
    var ts = el('#topStar');
    if (ts) ts.textContent = st.stars;
    var tl = el('#topLevel');
    if (tl) tl.textContent = 'Lv.' + st.level;
    checkPendingAch();
  }

  /* ---------- 每日打卡 ---------- */

  function openCheckin() {
    var c = S.checkinState();
    var day = c.streak + 1;
    var dots = '';
    for (var i = 1; i <= 7; i++) {
      dots += '<span class="sk-dot' + (i <= day ? ' on' : '') + '">' + (i <= day ? '✓' : i) + '</span>';
    }
    openModal('<h3>🎁 每日打卡</h3>' +
      '<p class="muted">今天是连续第 <b>' + day + '</b> 天，可以领 <b>⭐ ' + c.next + '</b> 星星币。</p>' +
      '<div class="streak-row">' + dots + '</div>' +
      '<p class="muted sm">连续打卡越久，每天领得越多（最多 60 ⭐）。</p>' +
      '<div class="modal-actions">' +
      '  <button class="btn ghost" data-close type="button">等会儿再说</button>' +
      '  <button class="btn primary" data-docheckin type="button">领星星</button>' +
      '</div>');
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (!S.ok()) {
      var warn = document.createElement('div');
      warn.className = 'warnbar';
      warn.innerHTML = '当前环境读不到本地存档（直接打开文件时会这样），本次游玩的进度关闭后就会丢失。想要存档，请把本文件放到网页空间里访问，或让大人帮忙生成一个在线链接。';
      document.body.insertBefore(warn, document.body.firstChild);
    }
    bind();
    render();
    if (!S.checkinState().done) openCheckin();
    S.onChange(function (_, external) { if (external) render(); });
    window.addEventListener('home:decor', function () {
      if (window.Shop) window.Shop.focus('wall');
      tab = 'shop';
      render();
    });
  });

  window.App = {
    toast: toast,
    render: function () { render(); },
    go: function (t) { tab = t; render(); },
    popAch: checkPendingAch      /* 家园里达成成就时立刻弹提示，不用等切页签 */
  };
})();

</script>
<script>
/* ===== js/admin.js（家长端，已做区域隔离） ===== */
/**
 * 家长管理端：审核任务、管理解锁、自定义任务、数据维护
 */
(function () {
  'use strict';

  var D = window.DATA, S = window.Store;
  var tab = 'review';
  var unlockedUI = false;

  var STATUS_TEXT = { todo: '未开始', pending: '待审核', approved: '已通过', rejected: '已驳回' };

  function el(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function time(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    function p(n) { return n < 10 ? '0' + n : n; }
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function rewardNames(t) {
    return (t.rewards || []).map(function (r) {
      if (r.indexOf('pony:') === 0) {
        var p = D.pony(r.slice(5));
        return '小马 · ' + (p ? p.name : r.slice(5));
      }
      var i = D.item(r);
      return i ? i.name : r;
    });
  }

  /* ---------- 弹层 ---------- */

  var modal = null;
  function openModal(html) {
    closeModal();
    modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = '<div class="modal-card">' + html + '</div>';
    modal.addEventListener('click', function (e) {
      if (e.target === modal || e.target.hasAttribute('data-close')) closeModal();
    });
    document.body.appendChild(modal);
    return modal;
  }
  function closeModal() {
    if (modal && modal.parentNode) modal.parentNode.removeChild(modal);
    modal = null;
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.className = 'toast out'; }, 1600);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  /* ---------- 页面 ---------- */

  function renderReview() {
    var list = S.allTasks().filter(function (t) { return S.taskStatus(t.id) === 'pending'; });
    list.sort(function (a, b) { return (S.state().tasks[b.id].submitAt || 0) - (S.state().tasks[a.id].submitAt || 0); });

    el('#adminPanel').innerHTML = '' +
      '<div class="adm-head"><h2 class="sec-title">待审核 <em>' + list.length + '</em></h2>' +
      '<p class="muted">审核通过后，对应的饰品或小马会立刻出现在孩子的衣柜里。</p></div>' +
      (list.length ? '<div class="rev-list">' + list.map(function (t) {
        var rec = S.state().tasks[t.id] || {};
        return '<div class="rev-card">' +
          '<div class="rev-main">' +
          '  <span class="tag">' + esc(t.tag || '任务') + '</span>' +
          '  <h4>' + esc(t.title) + '</h4>' +
          '  <p class="rev-desc">' + esc(t.desc) + '</p>' +
          (rec.note ? '<p class="rev-note">孩子说：' + esc(rec.note) + '</p>' : '<p class="rev-note muted">孩子没有留言</p>') +
          '  <p class="rev-time">提交于 ' + time(rec.submitAt) + '</p>' +
          '</div>' +
          '<div class="rev-side">' +
          '  <div class="rev-rw">' + rewardNames(t).map(function (n) { return '<span class="rw">' + esc(n) + '</span>'; }).join('') + '</div>' +
          '  <button class="btn primary sm" data-approve="' + t.id + '" type="button">通过</button>' +
          '  <button class="btn danger sm" data-reject="' + t.id + '" type="button">驳回</button>' +
          '</div>' +
          '</div>';
      }).join('') + '</div>' : '<div class="empty">暂时没有需要审核的任务，休息一下吧。</div>');
  }

  function renderAllTasks() {
    var list = S.allTasks();
    el('#adminPanel').innerHTML = '' +
      '<div class="adm-head"><h2 class="sec-title">任务总览 <em>' + list.length + '</em></h2>' +
      '<p class="muted">可以直接代孩子通过，或者把已通过的任务重置回未开始。</p></div>' +
      '<div class="table">' +
      '<div class="tr head"><span>任务</span><span>奖励</span><span>状态</span><span>操作</span></div>' +
      list.map(function (t) {
        var s = S.taskStatus(t.id);
        return '<div class="tr">' +
          '<span class="tname">' + esc(t.title) + '<i>' + esc(t.tag || '') + '</i></span>' +
          '<span class="trw">' + rewardNames(t).map(function (n) { return esc(n); }).join('、') + '</span>' +
          '<span><span class="badge ' + s + '">' + STATUS_TEXT[s] + '</span></span>' +
          '<span class="tops">' +
          (s !== 'approved' ? '<button class="btn primary xs" data-approve="' + t.id + '" type="button">通过</button>' : '') +
          (s !== 'todo' ? '<button class="btn ghost xs" data-reopen="' + t.id + '" type="button">重置</button>' : '') +
          (t.custom ? '<button class="btn danger xs" data-delcustom="' + t.id + '" type="button">删除</button>' : '') +
          '</span>' +
          '</div>';
      }).join('') +
      '</div>';
  }

  function renderManage() {
    var st = S.state();
    el('#adminPanel').innerHTML = '' +
      '<div class="adm-head"><h2 class="sec-title">解锁管理</h2>' +
      '<p class="muted">除了做任务，也可以手动给孩子打赏或收回。</p></div>' +
      '<h3 class="sec-title">小马伙伴</h3>' +
      '<div class="manage-grid">' + D.PONIES.map(function (p) {
        var has = S.hasPony(p.id);
        return '<div class="mg ' + (has ? 'on' : '') + '">' +
          '<span class="mg-art">' + (has ? '<svg viewBox="0 0 260 300" width="72">' +
            window.Avatar.render({ ponyId: p.id, outfit: {}, width: 72 }).replace(/^<svg[^>]*>/, '') : '<span class="lock-q">?</span>') + '</span>' +
          '<span class="mg-name">' + p.name + '</span>' +
          '<button class="btn ' + (has ? 'ghost' : 'primary') + ' xs" data-ponylock="' + p.id + '" data-to="' + (has ? 0 : 1) + '" type="button">' +
          (has ? '收回' : '解锁') + '</button>' +
          '</div>';
      }).join('') + '</div>' +
      D.CATS.map(function (c) {
        return '<h3 class="sec-title">' + c.name + '</h3><div class="manage-grid">' +
          D.bySlot(c.id).map(function (i) {
            var has = S.hasItem(i.id);
            return '<div class="mg ' + (has ? 'on' : '') + '">' +
              '<span class="mg-art ' + (i.slot === 'bg' ? 'cell-bg ' + i.id : '') + '">' +
              (i.slot === 'bg' ? '' : (has ? '<svg viewBox="0 0 260 300" width="72">' +
                window.Avatar.render({ ponyId: st.activePony, outfit: (function () { var o = {}; o[i.slot] = i.id; return o; })(), width: 72 }).replace(/^<svg[^>]*>/, '') : '<span class="lock-q">?</span>')) +
              '</span>' +
              '<span class="mg-name">' + i.name + '</span>' +
              '<button class="btn ' + (has ? 'ghost' : 'primary') + ' xs" data-itemlock="' + i.id + '" data-to="' + (has ? 0 : 1) + '" type="button">' +
              (has ? '收回' : '解锁') + '</button>' +
              '</div>';
          }).join('') + '</div>';
      }).join('');
  }

  function renderData() {
    var st = S.state();
    var s = S.stats();
    el('#adminPanel').innerHTML = '' +
      '<div class="adm-head"><h2 class="sec-title">数据与设置</h2></div>' +
      '<div class="form-row">' +
      '  <label>孩子的名字</label>' +
      '  <input id="nameInput" class="ipt" value="' + esc(st.player) + '" maxlength="12">' +
      '  <button class="btn primary sm" id="saveName" type="button">保存</button>' +
      '</div>' +
      '<div class="form-row">' +
      '  <label>管理端密码</label>' +
      '  <input id="pinInput" class="ipt" value="' + esc(st.pin) + '" maxlength="8" inputmode="numeric">' +
      '  <button class="btn primary sm" id="savePin" type="button">保存</button>' +
      '</div>' +
      '<h3 class="sec-title">统计</h3>' +
      '<div class="stat-grid">' +
      [['待完成', s.todo], ['待审核', s.pending], ['已通过', s.approved], ['已驳回', s.rejected],
       ['饰品', s.items + '/' + s.itemsTotal], ['小马', s.ponies + '/' + s.poniesTotal]].map(function (x) {
        return '<div class="stat"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>';
      }).join('') +
      '</div>' +
      '<h3 class="sec-title">自定义任务</h3>' +
      (st.customTasks.length ? '<div class="table">' + st.customTasks.map(function (t) {
        return '<div class="tr">' +
          '<span class="tname">' + esc(t.title) + '<i>自定义</i></span>' +
          '<span class="trw">' + rewardNames(t).map(function (n) { return esc(n); }).join('、') + '</span>' +
          '<span><span class="badge ' + S.taskStatus(t.id) + '">' + STATUS_TEXT[S.taskStatus(t.id)] + '</span></span>' +
          '<span class="tops"><button class="btn danger xs" data-delcustom="' + t.id + '" type="button">删除</button></span>' +
          '</div>';
      }).join('') + '</div>' : '<p class="muted">还没有自定义任务。</p>') +
      '<div class="form-row"><button class="btn primary sm" id="newTask" type="button">新增自定义任务</button></div>' +
      '<h3 class="sec-title">数据维护</h3>' +
      '<div class="form-row wrap">' +
      '  <button class="btn ghost sm" id="exportBtn" type="button">导出存档</button>' +
      '  <button class="btn ghost sm" id="importBtn" type="button">导入存档</button>' +
      '  <button class="btn danger sm" id="resetBtn" type="button">恢复出厂</button>' +
      '</div>' +
      '<textarea id="ioBox" class="ta mono" rows="4" placeholder="导出的存档会显示在这里，也可以把存档文本粘贴进来再点导入。"></textarea>' +
      '<h3 class="sec-title">最近操作</h3>' +
      '<div class="log">' + (st.log.length ? st.log.slice(0, 12).map(function (l) {
        return '<div class="log-row"><span class="log-act">' + esc(l.action) + '</span>' +
          '<span class="log-detail">' + esc(l.detail) + '</span>' +
          '<span class="log-time">' + time(l.at) + '</span></div>';
      }).join('') : '<p class="muted">暂无记录</p>') + '</div>';
  }

  /* ---------- 破解开关 ---------- */

  function renderCheatBtn() {
    var b = el('#cheatBtnAdmin');
    if (!b) return;
    var on = S.cheatOn();
    b.classList.toggle('on', on);
    b.textContent = on ? '🔓 破解中' : '🔒 破解开关';
    b.title = on ? '点击关闭破解，恢复到开启前的解锁状态' : '点击解锁全部小马和饰品';
  }

  function toggleCheat() {
    var on = !S.cheatOn();
    if (!on && !confirm('关闭破解后，会收回靠破解解锁的内容，恢复到开启破解前的状态。确定吗？')) return;
    S.setCheat(on);
    renderCheatBtn();
    toast(on ? '破解已开启：全部小马和饰品已解锁' : '破解已关闭，已恢复原状');
    if (unlockedUI) render();
  }

  /* ---------- 自定义任务弹层 ---------- */

  function openNewTask() {
    var groups = D.CATS.map(function (c) {
      return '<div class="rw-group"><h5>' + c.name + '</h5>' + D.bySlot(c.id).map(function (i) {
        return '<label class="ck"><input type="checkbox" value="' + i.id + '"><span>' + i.name + '</span></label>';
      }).join('') + '</div>';
    }).join('');
    var ponies = '<div class="rw-group"><h5>小马伙伴</h5>' + D.PONIES.filter(function (p) { return !p.initial; }).map(function (p) {
      return '<label class="ck"><input type="checkbox" value="pony:' + p.id + '"><span>' + p.name + '</span></label>';
    }).join('') + '</div>';

    openModal('<h3>新增自定义任务</h3>' +
      '<div class="form-col">' +
      '  <input id="ntTitle" class="ipt" placeholder="任务名称，例如：整理自己的玩具柜">' +
      '  <input id="ntDesc" class="ipt" placeholder="任务要求说明（可选）">' +
      '  <p class="muted sm">勾选完成后要发放的奖励：</p>' +
      '  <div class="rw-picker">' + groups + ponies + '</div>' +
      '</div>' +
      '<div class="modal-actions">' +
      '  <button class="btn ghost" data-close type="button">取消</button>' +
      '  <button class="btn primary" id="doNewTask" type="button">创建</button>' +
      '</div>');
  }

  /* ---------- 事件 ---------- */

  function bind() {
    document.addEventListener('click', function (e) {
      var n, t = e.target;
      function hit(sel) { return t.closest ? t.closest(sel) : null; }

      if ((n = hit('[data-cheat]')) && n.closest('#adminView')) { toggleCheat(); return; }
      if ((n = hit('[data-atab]'))) { tab = n.getAttribute('data-atab'); render(); return; }
      if ((n = hit('[data-close]'))) { closeModal(); return; }

      if ((n = hit('[data-approve]'))) {
        S.approve(n.getAttribute('data-approve'));
        toast('已通过，奖励已发放');
        render();
        return;
      }
      if ((n = hit('[data-reject]'))) {
        var id = n.getAttribute('data-reject');
        openModal('<h3>驳回原因</h3>' +
          '<p class="muted">写一句话，孩子能在任务卡上看到。</p>' +
          '<textarea id="reasonBox" class="ta" rows="3" placeholder="例如：这次只练了 10 分钟，明天补上就算完成。"></textarea>' +
          '<div class="modal-actions">' +
          '  <button class="btn ghost" data-close type="button">取消</button>' +
          '  <button class="btn danger" id="doReject" data-id="' + id + '" type="button">确认驳回</button>' +
          '</div>');
        return;
      }
      if ((n = hit('#doReject'))) {
        var rb = el('#reasonBox');
        S.reject(n.getAttribute('data-id'), rb ? rb.value.trim() : '这次还没有达到要求，再试一次吧');
        closeModal();
        toast('已驳回');
        render();
        return;
      }
      if ((n = hit('[data-reopen]'))) {
        S.reopen(n.getAttribute('data-reopen'));
        toast('已重置为未开始');
        render();
        return;
      }
      if ((n = hit('[data-delcustom]'))) {
        if (confirm('确定删除这个自定义任务吗？')) {
          S.removeCustomTask(n.getAttribute('data-delcustom'));
          render();
        }
        return;
      }
      if ((n = hit('[data-ponylock]'))) {
        S.setPonyLock(n.getAttribute('data-ponylock'), n.getAttribute('data-to') === '1');
        render();
        return;
      }
      if ((n = hit('[data-itemlock]'))) {
        S.setItemLock(n.getAttribute('data-itemlock'), n.getAttribute('data-to') === '1');
        render();
        return;
      }

      if (n && n.id === 'newTask') { openNewTask(); return; }
      if (n && n.id === 'doNewTask') {
        var ttl = el('#ntTitle'), dsc = el('#ntDesc');
        var rw = Array.prototype.slice.call(document.querySelectorAll('.rw-picker input:checked')).map(function (i) { return i.value; });
        if (!ttl || !ttl.value.trim()) { toast('请先填写任务名称'); return; }
        S.addCustomTask(ttl.value.trim(), dsc ? dsc.value.trim() : '', rw);
        closeModal();
        toast('自定义任务已创建');
        render();
        return;
      }
      if (n && n.id === 'saveName') {
        var ni = el('#nameInput');
        if (ni) { S.state().player = ni.value.trim() || '小朋友'; S.save(); toast('已保存'); }
        return;
      }
      if (n && n.id === 'savePin') {
        var pi = el('#pinInput');
        if (pi) { S.state().pin = pi.value.trim() || '1234'; S.save(); toast('密码已更新'); }
        return;
      }
      if (n && n.id === 'exportBtn') {
        var box = el('#ioBox');
        if (box) { box.value = S.exportJSON(); box.select(); toast('存档已生成，可直接复制保存'); }
        return;
      }
      if (n && n.id === 'importBtn') {
        var box2 = el('#ioBox');
        if (box2 && box2.value.trim()) {
          if (S.importJSON(box2.value)) { toast('导入成功'); render(); }
          else toast('存档格式不对，导入失败');
        }
        return;
      }
      if (n && n.id === 'resetBtn') {
        if (confirm('会清空所有任务和解锁记录，确定吗？')) {
          S.resetAll();
          toast('已恢复出厂设置');
          render();
        }
        return;
      }
      if ((n = hit('[data-lockbtn]'))) { checkPin(); return; }
    });
  }

  function checkPin() {
    var v = el('#pinField').value.trim();
    if (v === S.state().pin) {
      unlockedUI = true;
      el('#lockScreen').style.display = 'none';
      el('#adminBody').style.display = '';
      render();
    } else {
      var err = el('#pinErr');
      if (err) err.textContent = '密码不对，再想想～';
    }
  }

  function render() {
    renderCheatBtn();
    if (!unlockedUI) return;
    document.querySelectorAll('[data-atab]').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-atab') === tab);
    });
    if (tab === 'review') renderReview();
    else if (tab === 'tasks') renderAllTasks();
    else if (tab === 'manage') renderManage();
    else renderData();
    var badge = el('#adminBadge');
    if (badge) {
      var n = S.stats().pending;
      badge.textContent = n ? String(n) : '';
      badge.style.display = n ? '' : 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    bind();
    renderCheatBtn();
    var btn = el('#pinBtn');
    if (btn) btn.addEventListener('click', checkPin);
    var f = el('#pinField');
    if (f) f.addEventListener('keydown', function (e) { if (e.key === 'Enter') checkPin(); });
    S.onChange(function (_, external) { if (external && unlockedUI) render(); });
  });
})();

</script>
<script>
/* ===== 两端切换 ===== */

(function () {
  'use strict';
  var player = document.getElementById('playerView');
  var adminView = document.getElementById('adminView');

  function setMode(m) {
    var isAdmin = m === 'admin';
    if (window.Home) window.Home.stop();
    if (window.Games) window.Games.stop();
    player.hidden = isAdmin;
    adminView.hidden = !isAdmin;
    var bs = document.querySelectorAll('[data-mode]');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('on', bs[i].getAttribute('data-mode') === m);
    }
    try { window.scrollTo(0, 0); } catch (e) { /* 某些环境不支持 */ }
    if (!isAdmin && window.App) window.App.render();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-mode]') : null;
    if (b) setMode(b.getAttribute('data-mode'));
  });

  document.addEventListener('DOMContentLoaded', function () {
    setMode('player');   /* 每次打开都先到玩家端，家长端要输密码才进 */
  });
})();

</script>
</body>
</html>
